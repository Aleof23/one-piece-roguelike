  const known = st.revealed;
  const cover = style => crew.filter(c => c.style === style).length;
  return html`
    <div className="foe-brief">
      <${FoeFace} f=${f} size=${f.boss ? 64 : 48}/>
      <div className="min-w-0 flex-1">
        <div className="font-bold truncate" style=${{ fontFamily:'var(--font-ui)', fontSize:'18px' }}>${boss ? bossName(boss) : L(f.name)} <span style=${{ color:'var(--mist)', fontWeight:500 }}>· ${t('style.' + f.style)}</span></div>
        <div className="flex flex-wrap gap-1 mt-1">
          ${known ? html`
            ${f.weak ? html`<span className="tg weak">▲ ${t('bt.weak')}: ${t('style.' + f.weak)} <em>(${cover(f.weak)})</em></span>` : null}
            ${f.resist ? html`<span className="tg res">▼ ${t('bt.resist')}: ${t('style.' + f.resist)} <em>(${cover(f.resist)})</em></span>` : null}
            ${!f.weak && !f.resist ? html`<span className="tg unk">—</span>` : null}` : html`<span className="tg unk">? ${t('bt.unknown')}</span>`}
          <${HakiChips} h=${f.haki} small=${true}/>
        </div>
        ${f.traits.map(x => html`<div key=${x} className="text-xs" style=${{ color:'var(--mist)' }}><b style=${{ color:'var(--foam)' }}>${t('trait.' + x)}.</b> ${t('trait.' + x + 'D')}</div>`)}
        ${boss && boss.desc ? html`<div className="text-xs mt-1" style=${{ color:'var(--mist)' }}>${L(boss.desc)}</div>` : null}
      </div>
    </div>`;
}

function CombatEvent({ g, setG, node, done }){
  const [phase, setPhase] = useState(node.type === 'boss' ? 'intro' : 'brief');   // intro | brief | battle | result
  const [rep, setRep] = useState(null);
  const [choice, setChoice] = useState(null);
  const boss = node.type === 'boss', s = STAGES[g.stage], T = TYPES[node.type];
  const icon = boss ? RANKS[s.bossRank].icon : T.icon;
  const init = useMemo(() => battleInit(g, node), []);
  const risk = useMemo(() => projectRisk(g, node, 40), []);
  const sheet = React.useContext(SheetCtx);
  const take = it => { setG(cur => gainItem(cur, it)); setChoice('took'); };
  const swap = (old, it) => { setG(cur => swapItem(cur, old.id, it)); setChoice('took'); };
  const title = nodeLabel(node, s);
  const finish = fin => { const r = battleResult(g, node, fin); setG(r.g); setRep(r); setPhase('result'); };
  if (phase === 'intro') return html`<${BossIntro} stage=${g.stage} onGo=${() => setPhase('brief')}/>`;
  if (phase === 'brief') return html`
    <${Modal} wide=${true} tone=${T.color} eyebrow=${boss ? t('combat.eyebrowBoss', { stage:L(s.name) }) : t('type.' + node.type)} title=${title} icon=${icon}>
      <p className="m-0" style=${{ color:'var(--mist)' }}>${t('combat.introSim')}</p>
      <div>
        <div className="sect-title">${t('bt.foes')}</div>
        <div className="flex flex-col gap-2">${init.foes.map(f => html`<${FoeBrief} key=${f.id} f=${f} st=${init} crew=${init.allies}/>`)}</div>
      </div>
      <div>
        <div className="sect-title">${t('bt.vs')}</div>
        <div className="stat-row"><span>${t('combat.risk')}</span><span style=${{ color:risk[1] }}>${t('risk.' + risk[0])} · ${t('bt.win', { n:risk[2] })}</span></div>
        <div className="pbar"><i style=${{ width:risk[2] + '%', background:risk[1] }}></i></div>
        <div className="text-xs mt-1" style=${{ color:'var(--mist)' }}>${t('bt.loss', { n:risk[3] })} · ${t('harm.title')} ${init.H > 0 ? '+' : ''}${init.H}%</div>
      </div>
      <div className="flex flex-wrap gap-2">${init.allies.map(a => html`<button key=${a.id} type="button" className="mini-ally" onClick=${() => sheet && sheet(g.crew.find(c => c.id === a.id))} title=${t('cast.btn')}><${Face} look=${a.look} color=${a.color} size=${34} avatar=${a.avatar}/><span><b>${L(a.name)}</b><small>${t('role.' + a.frole)}</small></span><${HakiChips} h=${a.haki} small=${true}/></button>`)}</div>
      <button type="button" className="btn" onClick=${() => setPhase('battle')}>${t('bt.start')}</button>
    <//>`;
  if (phase === 'battle') return html`
    <${Modal} wide=${true} tone=${T.color} eyebrow=${t('bt.eyebrow')} title=${title} icon=${icon}>
      <${BattleArena} init=${init} onEnd=${finish} boss=${node.type === 'boss'}/>
    <//>`;
  const last = g.stage >= STAGES.length - 1;
  return html`
    <${Modal} tone=${rep.win ? '#f6b73c' : '#ff5d47'} eyebrow=${rep.win ? t('combat.resolved') : t('combat.end')} title=${rep.win ? (boss ? t('combat.bossDown') : t('combat.victory')) : t('combat.sunk')} icon=${rep.win ? 'crown' : 'skull'}>
      <div className="flex flex-col gap-2">${rep.rows.map(r => html`<${MiniHp} key=${r.c.id} c=${r.c} from=${r.from} to=${r.to}/>`)}</div>
      ${rep.fallen && rep.fallen.length ? html`<div className="flex flex-col gap-1">${rep.fallen.map(c => html`<p key=${c.id} className="m-0 text-sm" style=${{ color:'var(--ember)' }}><b>☠ ${t('hc.fell', { name:L(c.name) })}</b></p>`)}</div>` : null}
      ${rep.win ? html`
        <div className="flex flex-wrap gap-2">
          <span className="chip" style=${{ color:'var(--gold)' }}>${t('combat.berries', { n:rep.berries })}</span>
          <span className="chip">${t('bt.rounds', { n:rep.rounds })}</span>
          ${boss && !last ? html`<span className="chip" style=${{ color:'var(--kelp)' }}>${t('combat.levelUp', { n:SETTINGS.leadershipPerStage })}</span>` : null}
        </div>` : html`<p className="m-0" style=${{ color:'var(--mist)' }}>${t('combat.lost')}</p>`}
      ${rep.win && rep.items && rep.items.length > 1 && !choice ? html`<p className="m-0 text-sm" style=${{ color:'var(--gold)' }}>${t('combat.pickOne')}</p>` : null}
      ${rep.win && rep.items ? rep.items.filter(it => !choice || rep.items.length === 1).map(it => html`<${LootOffer} key=${it.id} g=${g} item=${it} choice=${choice} onTake=${() => take(it)} onLeave=${() => setChoice('left')} onSwap=${old => swap(old, it)}/>`) : null}
      ${rep.win && boss ? html`<div className="mx-auto w-[150px]"><${Poster} idx=${g.stage} defeated=${true}/></div>` : null}
      <button type="button" className="btn" disabled=${rep.win && !!rep.item && !choice} onClick=${() => done(rep)}>${rep.win ? (boss ? (last ? t('combat.claim') : t('combat.nextStage')) : t('combat.next')) : t('combat.outcome')}</button>
    <//>`;
}


function MarketEvent({ g, setG, done }){
  const [offers] = useState(() => shuffle(itemPool(g)).slice(0, 3));
  const [bought, setBought] = useState([]);
  const [rations, setRations] = useState(0);
  const [swapFor, setSwapFor] = useState(null);
  const buy = o => {
    if (g.berries < itemPrice(g, o) || bought.includes(o.id)) return;
    if (slotFull(g, o)){ setSwapFor(o); return; }
    setG(gainItem({ ...g, berries: g.berries - itemPrice(g, o) }, o)); setBought([...bought, o.id]);
  };
  const doSwap = old => { setG(swapItem(g, old.id, swapFor, itemPrice(g, swapFor))); setBought([...bought, swapFor.id]); setSwapFor(null); };
  const ration = () => {
    if (g.berries < rationPrice(g)) return;
    setG({ ...g, berries: g.berries - rationPrice(g), crew: g.crew.map(c => c.hp > 0 ? { ...c, hp: Math.min(c.maxHp, c.hp + Math.round(c.maxHp * .35)) } : c) });
    setRations(rations + 1);
  };
  if (swapFor) return html`
    <${Modal} tone="#f6b73c" eyebrow=${t('market.eyebrow')} title=${t('market.title')} icon="coin">
      <p className="m-0" style=${{ color:'var(--gold)' }}>${t('market.swapTitle', { name: L(swapFor.name) })}</p>
      <${SwapList} g=${g} item=${swapFor} onPick=${doSwap}/>
      <button type="button" className="btn ghost" onClick=${() => setSwapFor(null)}>${t('market.cancel')}</button>
    <//>`;
  return html`
    <${Modal} tone="#f6b73c" eyebrow=${t('market.eyebrow')} title=${t('market.title')} icon="coin">

function RecruitEvent({ g, setG, done }){
  const openSheet = React.useContext(SheetCtx);
  const [cands] = useState(() => recruitOffers(g, 3));
  useEffect(() => { setG(cur => ({ ...cur, offered:[...new Set([...(cur.offered || []), ...cands.map(c => c.id)])] })); }, []);
  const [hired, setHired] = useState([]);
  const room = leadRoom(g);
  const full = g.crew.length >= SETTINGS.crewSlots;
  const hire = def => {
    if (hired.includes(def.id) || !canRecruit(def, g)) return;
    setG({ ...g, crew: [...g.crew, makeMember(def, g.stage + 1, 'c' + g.uid)], uid: g.uid + 1 });
    setHired([...hired, def.id]);
  };
  return html`
    <${Modal} tone="#7be0ff" eyebrow=${t('recruit.eyebrow')} title=${t('recruit.title')} icon="recruit">
      <div className="stat-row"><span>${t('recruit.free')}</span><span className="price tabular-nums">${room}</span></div>
      ${cands.length === 0 ? html`<p className="m-0" style=${{ color:'var(--mist)' }}>${t('recruit.none')}</p>` : null}
      ${full && cands.length > 0 && hired.length === 0 ? html`<p className="m-0" style=${{ color:'var(--ember)' }}>${t('recruit.full')}</p>` : null}
      ${cands.map(def => {
        const got = hired.includes(def.id), no = !canRecruit(def, g);
        const lvl = g.stage + 1;
        return html`
        <div key=${def.id} className="offer">
          <${Zoomable} zoom=${zoomOfDef(def, lvl)}><${Face} look=${def.look} color=${def.color} size=${56} avatar=${def.avatar}/><//>
          <div className="min-w-0 flex-1">
            <div className="font-bold" style=${{ fontFamily:'var(--font-ui)', fontSize:'18px' }}>${L(def.name)} <span style=${{ color:'var(--mist)', fontWeight:500 }}>· ${L(def.role)}</span></div>
            <div className="flex flex-wrap items-center gap-1 my-1"><${RoleChip} role=${def.frole}/><${HakiChips} h=${def.hakiBase} small=${true}/><button type="button" className="crew-x sheet-btn" onClick=${() => openSheet && openSheet(makeMember(def, lvl, 'tmp'))}>${t('cast.btn')}</button></div>
            <div className="desc">${t('harm.after', { a:harmony(g.crew).score + '%', b:harmony([...g.crew, makeMember(def, lvl, 'tmp')]).score + '%' })}</div>
            <div className="desc">${t('recruit.stats', { hp: Math.round(def.baseHp * Math.pow(SETTINGS.levelUpHpMult, lvl - 1)), atk: Math.round(def.baseAtk * Math.pow(SETTINGS.levelUpAtkMult, lvl - 1)), lv: lvl })}</div>
            <div className="desc" style=${{ color: no && !got ? 'var(--ember)' : 'var(--mist)' }}>${t('recruit.cost', { n: def.cost })}${no && !got ? ' · ' + t('recruit.noRoom') : ''}</div>
          </div>
          <button type="button" className="btn small" disabled=${got || no} onClick=${() => hire(def)}>${got ? t('recruit.aboard') : t('recruit.btn')}</button>
        </div>`; })}
      <button type="button" className="btn ghost" onClick=${done}>${t('common.sail')}</button>
    <//>`;
}

function CampEvent({ g, setG, done }){
  const [rep, setRep] = useState(null);
  const pct = mods(g).campFull > 0 ? 100 : Math.round((.6 + mods(g).camp) * 100);
  const rest = () => { const r = sleep(g); setG(r.g); setRep(r); };
  return html`
    <${Modal} tone="#3dd6a0" eyebrow=${t('camp.eyebrow')} title=${t('camp.title')} icon="tent">
      ${rep ? html`<div className="flex flex-col gap-2">${rep.rows.map(r => html`<${MiniHp} key=${r.c.id} c=${r.c} from=${r.from} to=${r.to}/>`)}</div>`
            : html`<p className="m-0" style=${{ color:'var(--mist)' }}>${t('camp.desc', { n: pct })}</p>`}
      ${rep ? html`<button type="button" className="btn" onClick=${done}>${t('camp.break')}</button>`
            : html`<button type="button" className="btn" onClick=${rest}>${t('camp.sleep')}</button>`}
    <//>`;
}

function ChestEvent({ g, setG, done }){
  const [pool] = useState(() => availableFruits(g));
  const [fruit, setFruit] = useState(null), [opts, setOpts] = useState([]);
  const [opened, setOpened] = useState(false);
  const open = () => { const o = pool.length ? weightedPick(pool, 2) : []; setOpts(o); setFruit(o.length === 1 ? o[0] : null); setOpened(true); };
  const eligible = g.crew.filter(c => !c.fruit);
  const feed = c => { setG(eat(g, c.id, fruit)); done(); };
  const coins = () => { setG({ ...g, berries: g.berries + 150 }); done(); };
  const reject = () => { setG({ ...g, berries: g.berries + 100 }); done(); };
  return html`
    <${Modal} tone="#b66dff" eyebrow=${t('chest.eyebrow')} title=${t('chest.title')} icon="fruit">
      ${!opened ? html`
        <p className="m-0" style=${{ color:'var(--mist)' }}>${t('chest.desc')}</p>
        <button type="button" className="btn" onClick=${open}>${t('chest.open')}</button>`
      : !opts.length ? html`
        <p className="m-0" style=${{ color:'var(--mist)' }}>${t('chest.empty')}</p>
        <button type="button" className="btn" onClick=${coins}>${t('chest.take')}</button>`
      : !fruit ? html`
        <p className="m-0" style=${{ color:'var(--gold)' }}>${t('chest.pickOne')}</p>
        <div className="flex flex-col gap-2">${opts.map(f => html`
          <button key=${f.id} type="button" className="offer" style=${{ cursor:'pointer', textAlign:'left', alignItems:'flex-start' }} onClick=${() => setFruit(f)}>
            <div className="fruit-orb" style=${{ '--fc': f.color }}><${Ico} n="fruit" size=${24} sw=${1.8}/></div>
            <div className="flex-1 min-w-0"><div className="font-bold" style=${{ fontFamily:'var(--font-ui)', fontSize:'18px' }}>${L(f.name)} <span className="eyebrow">${fruitType(f)}</span></div>
              <div className="text-sm" style=${{ color:'var(--gold)' }}>${fruitMult(f)}</div>
              <div className="flex flex-wrap gap-1 mt-1">${fxLines(f).map(l => html`<span key=${l} className="chip">${l}</span>`)}</div></div>
          </button>`)}</div>
        <button type="button" className="btn ghost small" onClick=${reject}>${t('chest.rejectAll')}</button>`
      : html`
        <div className="flex flex-col items-center gap-2 text-center">
          <div className="fruit-orb reveal" style=${{ '--fc': fruit.color, width:92, height:92 }}><${Ico} n="fruit" size=${54} sw=${1.8}/></div>
          <div className="victory-title" style=${{ fontSize:'32px' }}>${L(fruit.name)}</div>
          <div className="eyebrow">${fruitType(fruit)}</div>
          <div className="text-lg font-bold" style=${{ fontFamily:'var(--font-ui)', color:'var(--gold)' }}>${fruitMult(fruit)}</div>
          <div className="flex flex-wrap justify-center gap-1">${fxLines(fruit).map(l => html`<span key=${l} className="chip">${l}</span>`)}</div>
          <div className="tiny" style=${{ fontStyle:'italic' }}>${fruitLore(fruit)}</div>
        </div>
        ${eligible.length ? html`
          <div className="eyebrow">${t('chest.who')}</div>
          <div className="flex flex-col gap-2">${eligible.map(c => html`
            <button key=${c.id} type="button" className="offer" style=${{ cursor:'pointer', textAlign:'left' }} onClick=${() => feed(c)}>
              <${Face} look=${c.look} color=${c.color} size=${44} avatar=${c.avatar}/>
              <div className="flex-1 min-w-0"><div className="font-bold" style=${{ fontFamily:'var(--font-ui)', fontSize:'18px' }}>${L(c.name)}</div><div className="desc">${t('chest.change', { a1: c.atk, a2: Math.round(c.atk * fruit.atk), h1: c.maxHp, h2: Math.round(c.maxHp * fruit.hp) })}</div></div>
              <span className="price">${t('chest.eat')}</span>
            </button>`)}</div>`
        : html`<p className="m-0" style=${{ color:'var(--mist)' }}>${t('chest.noneLeft')}</p><button type="button" className="btn" onClick=${coins}>${t('chest.sell')}</button>`}
        <div className="flex flex-wrap gap-2 justify-center">${opts.length > 1 ? html`<button type="button" className="btn ghost small" onClick=${() => setFruit(null)}>${t('chest.back')}</button>` : null}<button type="button" className="btn ghost small" onClick=${reject}>${t('chest.reject')}</button></div>`}
    <//>`;
}

function MapEvent({ g, setG, node, done }){
  const id = useMemo(() => eventOf(g, node), []);
  const [res, setRes] = useState(null);
  const berries = eventBerries(g, node);
  const alive = g.crew.filter(c => c.hp > 0);
  const hasHaki = g.crew.some(c => c.hp > 0 && c.hakiBase && c.hakiBase.obs > 0);
  const go = choice => { const r = eventRun(g, node, id, choice); setG(r.g); setRes(r); };
  const opts = id === 'castaway' ? [['help', 'ev.castaway.help'], ['leave', 'ev.castaway.leave']]
    : id === 'trapchest' ? [['open', 'ev.trapchest.open'], ...(hasHaki ? [['haki', 'ev.trapchest.haki']] : []), ['leave', 'ev.trapchest.leave']]
    : id === 'whirlpool' ? [['cross', 'ev.whirlpool.cross'], ['leave', 'ev.whirlpool.leave']]
    : id === 'gamble' ? [['small', 'ev.gamble.small'], ['big', 'ev.gamble.big'], ['leave', 'ev.gamble.leave']].filter(o => o[0] === 'leave' || g.berries >= 40)
    : [];
  return html`
    <${Modal} tone="#ffa94d" eyebrow=${t('ev.eyebrow')} title=${t('ev.' + id + '.title')} icon="bottle">
      ${!res ? html`
        <p className="m-0" style=${{ color:'var(--mist)' }}>${t('ev.' + id + '.desc')}</p>
        ${id === 'pact' ? html`<div className="flex flex-col gap-2">${alive.filter(c => c.hp > 1).map(c => html`
          <button key=${c.id} type="button" className="offer" style=${{ cursor:'pointer', textAlign:'left' }} onClick=${() => go('c:' + c.id)}>
            <${Face} look=${c.look} color=${c.color} size=${44} avatar=${c.avatar}/>
            <div className="flex-1 min-w-0"><div className="font-bold" style=${{ fontFamily:'var(--font-ui)', fontSize:'18px' }}>${L(c.name)}</div><div className="desc">${t('ev.pact.change', { h:c.hp, h2:Math.max(1, Math.round(c.hp * .6)), lv:c.lvl, lv2:c.lvl + 1 })}</div></div>
            <span className="price">${t('ev.pact.btn')}</span>
          </button>`)}</div>
          <button type="button" className="btn ghost" onClick=${() => go('leave')}>${t('ev.pact.leave')}</button>`
        : html`<div className="flex flex-col gap-2">${opts.map(([k, tk]) => html`<button key=${k} type="button" className=${k === 'leave' ? 'btn ghost' : 'btn'} onClick=${() => go(k)}>${t(tk)}</button>`)}</div>`}`
      : html`
        <p className="m-0" style=${{ color: res.bad ? 'var(--ember)' : 'var(--foam)', fontWeight:600 }}>${t('ev.res.' + res.key, { n:res.n, name:res.def ? L(res.def.name) : res.name ? L(res.name) : '', item:res.item ? L(res.item.name) : '' })}</p>
        ${res.rows ? html`<div className="flex flex-col gap-2">${res.rows.filter(r => r.from !== r.to || r.c.hp !== undefined).map(r => html`<${MiniHp} key=${r.c.id} c=${r.c} from=${r.from} to=${r.to}/>`)}</div>` : null}
        <button type="button" className="btn" onClick=${done}>${t('common.sail')}</button>`}
    <//>`;
}

/* ---------- final cinematico de la victoria ---------- */
function WinCinematic({ g, onRestart }){
  const [scene, setScene] = useState(0), [run, setRun] = useState(0);
  const t0 = React.useRef(Date.now());
  const yonko = STAGES.filter(s => s.bossRank === 'yonko').length;
  const total = g.bounties.reduce((a, i) => a + STAGES[i].boss.bounty, 0);
  const fname = g.flag && g.flag.name ? g.flag.name : '';
  const crew = g.crew;
  const fruits = crew.filter(c => c.fruit).length;
  const stars = useMemo(() => { const r = mulberry32(777); return Array.from({ length:90 }, () => ({ x:r() * 100, y:r() * 78, s:1 + r() * 2.2, d:r() * 4 })); }, []);
  const lanterns = useMemo(() => { const r = mulberry32(4242); return Array.from({ length:16 }, () => ({ x:r() * 100, dx:(r() - .5) * 120, dur:10 + r() * 8, d:r() * 9 })); }, []);
  const D = i => ({ '--d':(i * 2.7 + .8) + 's' });
  const L1 = (k, i, cls, p) => html`<div key=${k} className=${'fin-line ' + (cls || '')} style=${D(i)}>${t('fin.' + k, p)}</div>`;
  const P = { n:STAGES.length, y:yonko, flag:fname, crew:crew.length };
  const scenes = [
    { sky:'s0', ms:12500, ship:true, body:() => html`${L1('d1', 0, '', P)}${L1('d2', 1, 'soft', P)}` },
    { sky:'s1', ms:15500, ship:true, body:() => html`${L1('r1', 0, 'big', P)}${L1('r2', 1, '', P)}${L1(fname ? 'r3f' : 'r3', 2, 'soft', P)}` },
    { sky:'s2', ms:19500, body:() => html`${L1('c1', 0, 'big', P)}
      <div className="fin-crew">${crew.map((c, i) => html`<div key=${c.id} className="fin-mate" style=${{ '--d':(3.6 + i * .55) + 's' }}><${Face} look=${c.look} color=${c.color} size=${58} avatar=${c.avatar}/><b>${L(c.name)}</b><i>${t('role.' + c.frole)}</i></div>`)}</div>
      ${L1('c2', 3 + Math.ceil(crew.length * .55 / 2.7), 'soft', P)}` },
    { sky:'s3', ms:17000, body:() => html`
      <svg className="fin-chest" viewBox="-20 -50 240 200" aria-hidden="true" style=${{ overflow:"visible" }}>
        <defs><radialGradient id="fg" cx="50%" cy="50%" r="50%"><stop offset="0" stopColor="#fff6c8"/><stop offset=".45" stopColor="#ffc457" stopOpacity=".75"/><stop offset="1" stopColor="#ff9a2a" stopOpacity="0"/></radialGradient></defs>
        <rect x="20" y="78" width="160" height="52" rx="6" fill="#5e3416" stroke="#1a0d05" strokeWidth="3"/>
        <rect x="20" y="96" width="160" height="7" fill="#d9a441"/><rect x="92" y="88" width="16" height="22" rx="3" fill="#f3c96a" stroke="#1a0d05" strokeWidth="2"/>
        <g className="glow"><circle cx="100" cy="76" r="86" fill="url(#fg)"/><path d="M100 76L40 -20L70 -20ZM100 76L100 -30L128 -30ZM100 76L170 -10L190 10Z" fill="#fff3bf" opacity=".28"/></g>
        <g className="lid"><path d="M20 78Q20 30 100 30Q180 30 180 78Z" fill="#7a4620" stroke="#1a0d05" strokeWidth="3"/><path d="M20 66H180" stroke="#d9a441" strokeWidth="6"/></g>
      </svg>
      ${L1('h1', 1, '', P)}${L1('h2', 2, 'soft', P)}${L1('h3', 3, 'big', P)}` },
    { sky:'s4', ms:19500, body:() => {
      const pts = STAGES.map((s, i) => ({ x:60 + i * (780 / Math.max(1, STAGES.length - 1)), y:120 + Math.sin(i * 1.25) * 52, n:L(s.name) }));
      return html`
        <svg className="fin-map" viewBox="0 0 900 250" role="img" aria-label=${t('fin.mapAria')}>
          ${pts.slice(1).map((p, i) => html`<path key=${'l' + i} className="ln" d=${'M' + pts[i].x + ' ' + pts[i].y + 'L' + p.x + ' ' + p.y} style=${{ '--d':(i * .75 + .6) + 's' }}/>`)}
          ${pts.map((p, i) => html`<g key=${'p' + i}><circle className="pt" cx=${p.x} cy=${p.y} r=${i === pts.length - 1 ? 9 : 5} style=${{ '--d':(i * .75) + 's' }}/><text x=${p.x} y=${p.y + 30} style=${{ '--d':(i * .75 + .3) + 's' }}>${p.n}</text></g>`)}
        </svg>
        ${L1('m1', 3, '', P)}${L1('m2', 4, 'soft', P)}`; } },
    { sky:'s4', ms:38000, body:() => html`<div className="fin-voice">${['v1', 'v2', 'v3', 'v4', 'v5', 'v6', 'v7'].map((k, i) => html`<div key=${k} className=${'fin-line ' + (i === 2 ? 'sea big' : 'sea')} style=${{ '--d':(i * 4.4 + .6) + 's' }}>${t('fin.' + k, P)}</div>`)}<div className="fin-line big last" style=${{ '--d':(7 * 4.4 + .6) + 's' }}>${t('fin.v8', P)}</div></div>` },
    { sky:'s5', ms:0, final:true, body:() => html`
      <div className="fin-flagwrap"><${Flag} flag=${g.flag || DEFAULT_FLAG} size=${190} wave=${true}/></div>
      ${fname ? html`<div className="flag-name">${fname}</div>` : null}
      <div className="fin-title">${t('end.win')}</div>
      <div className="fin-line soft" style=${{ '--d':'1.6s' }}>${t('fin.final')}</div>
      <div className="fin-crew" style=${{ gap:10 }}>${crew.map((c, i) => html`<${Face} key=${c.id} look=${c.look} color=${c.color} size=${44} avatar=${c.avatar}/>`)}</div>
      <div className="fin-stats"><span>${t('fin.s.seas', { n:STAGES.length })}</span><span>${t('fin.s.crew', { n:crew.length })}</span>${fruits ? html`<span>${t('fin.s.fruits', { n:fruits })}</span>` : null}<span>${t('fin.s.items', { n:g.items.length })}</span>${total > 0 ? html`<span>${t('end.total')}: ${fmtBounty(total)}</span>` : null}</div>
      <div className="fin-actions"><button type="button" className="btn" onClick=${e => { e.stopPropagation(); onRestart(); }}>${t('end.again')}</button><button type="button" className="btn ghost" onClick=${e => { e.stopPropagation(); setScene(0); setRun(r => r + 1); }}>${t('fin.replay')}</button></div>` },
  ];
  const last = scenes.length - 1, sc = scenes[scene];
  const go = n => { t0.current = Date.now(); setScene(Math.max(0, Math.min(last, n))); };
  useEffect(() => { t0.current = Date.now(); if (sc.final) return; const id = setTimeout(() => setScene(x => Math.min(last, x + 1)), sc.ms); return () => clearTimeout(id); }, [scene, run]);
  useEffect(() => {
    const h = e => { if (e.key === 'Escape') go(last); else if (e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowRight') { if (!sc.final && Date.now() - t0.current > 1200) { e.preventDefault(); go(scene + 1); } } };
    window.addEventListener('keydown', h); return () => window.removeEventListener('keydown', h);
  }, [scene]);
  const wave = (c, cls) => html`<svg className=${cls} viewBox="0 0 1200 100" preserveAspectRatio="none" aria-hidden="true"><path d="M0 40Q75 10 150 40T300 40T450 40T600 40T750 40T900 40T1050 40T1200 40V100H0Z" fill=${c}/><path d="M0 40Q75 10 150 40T300 40T450 40T600 40T750 40T900 40T1050 40T1200 40V100H0Z" transform="translate(1200 0)" fill=${c}/></svg>`;
  return html`
    <div className="fin-root" role="dialog" aria-modal="true" aria-label=${t('end.win')} onClick=${() => { if (!sc.final && Date.now() - t0.current > 1200) go(scene + 1); }}>
      <div className=${'fin-sky ' + sc.sky}></div>
      <div style=${{ position:'absolute', inset:0, opacity: sc.sky === 's5' ? 0 : 1, transition:'opacity 4s' }}>${stars.map((s, i) => html`<span key=${i} className="fin-star" style=${{ left:s.x + '%', top:s.y + '%', width:s.s, height:s.s, animationDelay:s.d + 's' }}></span>`)}</div>
      <div className="fin-sea">${wave(sc.sky === 's5' ? '#27386b' : '#091733', 'a')}${wave(sc.sky === 's5' ? '#3a4a80' : '#0e2147', 'b')}</div>
      ${sc.ship ? html`<svg className="fin-ship" viewBox="0 0 170 130" aria-hidden="true" key=${'ship' + scene}>
        <path d="M82 6V92" stroke="#06080f" strokeWidth="4"/><path d="M86 12Q130 40 128 80H86Z" fill="#e9dfc2" stroke="#06080f" strokeWidth="2.5"/><path d="M78 20Q42 44 44 84H78Z" fill="#d9ceaa" stroke="#06080f" strokeWidth="2.5"/>
        <path d="M82 6l22-6-4 9 4 8z" fill="#06080f"/><path d="M14 92H156Q146 118 124 118H46Q24 118 14 92Z" fill="#2b1608" stroke="#06080f" strokeWidth="3"/><path d="M20 100H150" stroke="#d9a441" strokeWidth="3"/></svg>` : null}
      ${sc.final ? html`<div aria-hidden="true">${lanterns.map((l, i) => html`<span key=${i} className="fin-lantern" style=${{ left:l.x + '%', '--dx':l.dx + 'px', animationDuration:l.dur + 's', animationDelay:l.d + 's' }}></span>`)}</div>` : null}
      <div className="fin-stage" key=${scene + '-' + run}>${sc.body()}</div>
      ${!sc.final ? html`<div className="fin-ctl"><button type="button" className="btn ghost small" onClick=${e => { e.stopPropagation(); go(last); }}>${t('fin.skip')}</button></div><div className="fin-hint">${t('fin.hint')}</div>` : null}
      <div className="fin-dots" aria-hidden="true">${scenes.map((_, i) => html`<i key=${i} className=${i === scene ? 'on' : ''}></i>`)}</div>
    </div>`;
}

function EndScreen({ g, onRestart }){
  const win = g.over === 'win';
  if (win) return html`<${WinCinematic} g=${g} onRestart=${onRestart}/>`;
  const yonko = STAGES.filter(s => s.bossRank === 'yonko').length;

/* etiquetas de efecto de un objeto (reliquia o equipo) */
function itemTags(it){
  const o = [], f = it.fx || {}, p = n => Math.round(n * 100);
  if (f.power) o.push(t('fx.power', { n:p(f.power) }));
  if (f.guard) o.push(t('fx.guard', { n:p(f.guard) }));
  if (f.berry) o.push(t('fx.berry', { n:p(f.berry) }));
  if (f.camp) o.push(t('fx.camp', { n:p(f.camp) }));
  if (f.hp) o.push(t('man.fx.hp', { n:f.hp }));
  if (f.lead) o.push(t('man.fx.lead', { n:f.lead }));
  if (f.spd) o.push(t('fx.spd', { n:f.spd }));
  if (f.crit) o.push(t('fx.crit', { n:p(f.crit) }));
  if (f.acc) o.push(t('fx.acc', { n:p(f.acc) }));
  if (f.dodge) o.push(t('fx.dodge', { n:p(f.dodge) }));
  if (f.charge) o.push(t('fx.charge', { n:f.charge }));
  if (f.regen) o.push(t('fx.regen', { n:Math.round(f.regen * 1000) / 10 }));
  if (f.harm) o.push(t('fx.harm', { n:f.harm }));
  if (f.reveal) o.push(t('fx.reveal'));
  if (f.calm) o.push(t('fx.calm', { n:p(f.calm) }));
  if (f.ambush) o.push(t('fx.ambush', { n:p(f.ambush) }));
  if (f.loot) o.push(t('fx.loot', { n:p(f.loot) }));
  if (f.ward) o.push(t('fx.ward'));
  if (f.revive) o.push(t('fx.revive'));
  if (f.campFull) o.push(t('fx.campFull'));
  const e = it.equip;
  if (e) {
    const sg = n => (n > 0 ? '+' : '−') + Math.abs(n);
    for (const k in (e.stats || {})) o.push(t('stat.' + k) + ' ' + sg(e.stats[k]));
    if (e.atkPct) o.push(t('eq.atk', { n:sg(p(e.atkPct)) }));
    if (e.hpPct) o.push(t('eq.hp', { n:sg(p(e.hpPct)) }));
    if (e.crit) o.push(t('fx.crit', { n:p(e.crit) }));
    if (e.acc) o.push(t('fx.acc', { n:p(e.acc) }));
    if (e.dodge) o.push(t('fx.dodge', { n:p(e.dodge) }));
    if (e.charge) o.push(t('fx.charge', { n:e.charge }));
    if (e.guardPct) o.push(t('fx.guard', { n:p(e.guardPct) }));
    if (e.aggro && e.aggro > 1) o.push(t('eq.aggro'));
    if (e.pierce) o.push(t('eq.pierce'));
    for (const k in (e.haki || {})) o.push(t('haki.' + k) + ' +' + e.haki[k]);
  }
  return o;
}
function ItemTags({ it }){
  const tg = itemTags(it);
  return html`<span className="man-chips">${it.equip ? html`<span className="chip" style=${{ color:'var(--fruit, #b66dff)' }}>${t('item.equip')}</span>` : null}${tg.map((x, i) => html`<span key=${i} className="chip">${x}</span>`)}</span>`;

/* ---------- despedir a un nakama ---------- */
function DismissDialog({ g, id, setG, onClose }){
  const [res, setRes] = useState(null);
  const c = g.crew.find(x => x.id === id) || (res && res.c);
  if (!c) return null;
  if (res) return html`
    <${Modal} tone=${res.protest ? '#ff5d47' : '#f6b73c'} eyebrow=${t('dismiss.eyebrow')} title=${t('dismiss.doneTitle', { name: L(c.name) })} icon="exit">
      <p className="m-0" style=${{ color:'var(--mist)' }}>${t('dismiss.paid', { n: res.fee })}</p>
      ${res.protest ? html`<p className="m-0" style=${{ color:'var(--ember)' }}><b>${t('dismiss.protested', { name: L(res.protest.name) })}</b></p>`
                     : html`<p className="m-0" style=${{ color:'var(--mist)' }}>${t('dismiss.quiet')}</p>`}
      <button type="button" className="btn" onClick=${onClose}>${t('dismiss.ok')}</button>
    <//>`;
  const fee = dismissFee(g, c), pct = Math.round(SETTINGS.dismissLeaveChance * 100);
  const others = g.crew.some(x => !x.captain && x.id !== c.id);
  const go = () => { const r = dismissMember(g, id); if (r){ setG(r.g); setRes(r); } };
  return html`
    <${Modal} tone="#ff5d47" eyebrow=${t('dismiss.eyebrow')} title=${t('dismiss.title', { name: L(c.name) })} icon="exit">
      <div className="flex items-center gap-3">
        <${Face} look=${c.look} color=${c.color} size=${64} avatar=${c.avatar}/>
        <div className="min-w-0"><div className="font-bold" style=${{ fontFamily:'var(--font-ui)', fontSize:'20px' }}>${L(c.name)}</div><div className="eyebrow">${L(c.role)} · ${t('common.lv')} ${c.lvl}</div></div>
      </div>
      <ul className="m-0 pl-5 flex flex-col gap-1" style=${{ color:'var(--foam)' }}>
        <li style=${{ color:'var(--gold)' }}>${t('dismiss.fee', { n: fee })}</li>
        ${others ? html`<li style=${{ color:'var(--ember)' }}>${t('dismiss.protest', { n: pct })}</li>` : null}
        ${c.fruit ? html`<li style=${{ color:'var(--ember)' }}>${t('dismiss.fruit', { name: L(c.fruit.name) })}</li>` : null}
        <li>${t('dismiss.never')}</li>
        <li style=${{ color:'var(--kelp)' }}>${t('dismiss.free', { n: c.cost })}</li>
      </ul>
      <div className="flex gap-2 flex-wrap">
        <button type="button" className="btn ghost" onClick=${onClose}>${t('dismiss.cancel')}</button>
        <button type="button" className="btn danger" onClick=${go}>${t('dismiss.confirm')}</button>
      </div>
    <//>`;
}

function DataDialog({ raw, src, errors, onFile, onReload, onClose }){
  const describe = k => {
    const d = raw[k];
    if (!d) return t('data.missing');
    if (k === 'characters') return t('data.counts.characters', { n: (d.nakamas || []).length, b: (d.bosses || []).length });
    if (k === 'fruits') return t('data.counts.fruits', { n: (d.fruits || []).length });
    if (k === 'stages') return t('data.counts.stages', { n: (d.stages || []).length });
    return t('data.counts.items', { n: (d.items || []).length });
  };
  const source = k => { const s = src[k]; return !s ? t('data.missing') : s === 'page' ? t('data.fromPage') : t('data.fromLocal', { name: s.slice(6) }); };
  return html`
    <${Modal} tone="#7be0ff" eyebrow=${t('data.eyebrow')} title=${t('data.title')} icon="treasure">
      <p className="m-0" style=${{ color:'var(--mist)' }}>${t('data.help')}</p>
      ${FILES.map(([k, name]) => html`
        <div key=${k} className="filerow">
          <div className="stat-row" style=${{ marginBottom: 0 }}><span>${name}</span><span style=${{ color:'var(--gold)' }}>${describe(k)}</span></div>
          <div className="text-xs" style=${{ color:'var(--mist)' }}>${source(k)}</div>
          <label className="text-xs" style=${{ color:'var(--foam)' }}>${t('data.pick')}:
            <input type="file" id=${'file-' + k} accept=".json,application/json" className="block mt-1 text-xs" onChange=${e => { const f = e.target.files && e.target.files[0]; if (f) onFile(k, f); e.target.value = ''; }}/>
          </label>
        </div>`)}
      ${errors.length ? html`<div className="errbox" role="alert"><b>${t('data.errors')}</b><ul className="m-0 mt-1 pl-4">${errors.map((e, i) => html`<li key=${i}>${e}</li>`)}</ul></div>` : null}
      <div className="flex gap-2 flex-wrap">
        <button type="button" className="btn ghost small" onClick=${onReload}>${t('data.reload')}</button>
        <button type="button" className="btn small" onClick=${onClose}>${t('data.close')}</button>
      </div>
    <//>`;
}

/* ================= MISIONES PRINCIPALES: progreso permanente guardado en el navegador ================= */
const META_KEY = 'lp-meta-v1';
const META0 = { best:0, maxCrew:0, fruits:0, berries:0, events:0, notified:[] };
function readMeta(){ try { const m = JSON.parse(localStorage.getItem(META_KEY) || '{}'); return { ...META0, ...m, notified:Array.isArray(m.notified) ? m.notified : [] }; } catch (e) { return { ...META0 }; } }
function writeMeta(m){ try { localStorage.setItem(META_KEY, JSON.stringify(m)); } catch (e) {} }
/* stat: lo que se mide (best = jefes de ruta derrotados en la mejor partida); goal: lo que hay que alcanzar; unlock: lo que se consigue */
const MISSIONS = [
  { id:'boss2',  stat:'best',    goal:2,    unlock:{ arch:'swordsman' } },
  { id:'boss4',  stat:'best',    goal:4,    unlock:{ arch:'gunner' } },
  { id:'boss6',  stat:'best',    goal:6,    unlock:{ arch:'strategist' } },
  { id:'crew5',  stat:'maxCrew', goal:5,    unlock:{ hero:'hero_nami' } },
  { id:'fruit2', stat:'fruits',  goal:2,    unlock:{ hero:'hero_usopp' } },
  { id:'boss5',  stat:'best',    goal:5,    unlock:{ hero:'hero_zoro' } },
  { id:'rich',   stat:'berries', goal:2000, unlock:{ hero:'hero_sanji' } },
  { id:'events', stat:'events',  goal:4,    unlock:{ hero:'hero_chopper' } },
  { id:'boss7',  stat:'best',    goal:7,    unlock:{ hero:'hero_luffy' } },
];
const missionDone = (m, mt) => (mt[m.stat] || 0) >= m.goal;
const missionFor = (kind, id) => MISSIONS.find(m => m.unlock[kind] === id) || null;
const archUnlocked = (mt, id) => { const m = missionFor('arch', id); return !m || missionDone(m, mt); };
const heroUnlocked = (mt, id) => { const m = missionFor('hero', id); return !m || missionDone(m, mt); };
const effArch = (mt, id) => ARCHETYPES.find(a => a.id === id && archUnlocked(mt, a.id)) || ARCHETYPES.find(a => archUnlocked(mt, a.id)) || ARCHETYPES[0];
const effCaptain = (mt, id) => { const caps = NAKAMAS.filter(n => n.captain); return caps.find(c => c.id === id && (!c.hero || heroUnlocked(mt, c.id))) || caps.find(c => !c.hero) || caps[0]; };
function metaFromRun(mt, g){
  const best = g.over === 'win' ? STAGES.length : g.stage;
  const n = { ...mt, best:Math.max(mt.best, best), maxCrew:Math.max(mt.maxCrew, g.crew.length), fruits:Math.max(mt.fruits, g.crew.filter(c => c.fruit).length), berries:Math.max(mt.berries, g.berries) };
  return ['best', 'maxCrew', 'fruits', 'berries'].some(k => n[k] !== mt[k]) ? n : mt;
}
const rewardName = m => m.unlock.arch ? L((ARCHETYPES.find(a => a.id === m.unlock.arch) || {}).name) : L((NAKAMAS.find(n => n.id === m.unlock.hero) || {}).name);
const missionText = m => t('ms.' + m.stat, { n:m.goal });

function DevAsk({ onOk, onClose }){
  const [v, setV] = useState(''), [bad, setBad] = useState(false);
  const go = e => { e.preventDefault(); if (devHash(v.trim()) === DEV_HASH) onOk(); else { setBad(true); setV(''); } };
  return html`<div className="modal-wrap" role="dialog" aria-modal="true" onClick=${onClose}>
    <form className="modal" style=${{ '--tone':'#7be0ff', maxWidth:360 }} onClick=${e => e.stopPropagation()} onSubmit=${go}>
      <div className="modal-body" style=${{ paddingTop:18 }}>
        <input type="password" autoFocus className="flag-input" style=${{ maxWidth:'none' }} value=${v} onChange=${e => { setV(e.target.value); setBad(false); }} aria-label="Password" autoComplete="off"/>
        ${bad ? html`<div className="errbox">✕</div>` : null}
        <div className="flex gap-2 justify-end"><button type="button" className="btn ghost small" onClick=${onClose}>Cancel</button><button type="submit" className="btn small">OK</button></div>
      </div>

}

        <div className="sect-title">Progress</div>

          <button type="button" className="btn ghost small" onClick=${() => { if (!confirm('Reset missions, unlocks and records (keeps flag, language and settings)?')) return; try { localStorage.removeItem(META_KEY); localStorage.removeItem(SAVE_KEY); localStorage.removeItem('lp-tut'); } catch (e) {} location.reload(); }}>Reset progress</button>
          <button type="button" className="btn ghost small" onClick=${() => { if (!confirm('Reset EVERYTHING saved in this browser (progress, current run, flag, tutorial, language, sound)? Dev mode stays unlocked.')) return; try { Object.keys(localStorage).filter(k => k.indexOf('lp-') === 0 && k !== DEV_KEY).forEach(k => localStorage.removeItem(k)); } catch (e) {} location.reload(); }}>Reset all local data</button>

          <button type="button" className="btn ghost small" onClick=${onClose}>Close</button>
        </div>

    : f.pattern === 'split' ? html`<path d="M170 0 L170 110 L0 110Z" fill=${B}/>`
    : f.pattern === 'cross' ? html`<g fill=${B}><rect x="36" y="0" width="16" height="110"/><rect x="0" y="43" width="170" height="14"/></g>`
    : f.pattern === 'checker' ? html`<g fill=${B}>${Array.from({ length:14 }).map((_, i) => html`<g key=${i}><rect x=${10 + i * 10.2} y=${i % 2 ? 12 : 22} width="10.2" height="10"/><rect x=${10 + i * 10.2} y=${i % 2 ? 76 : 66} width="10.2" height="10"/></g>`)}</g>`
    : f.pattern === 'rays' ? html`<g fill=${B} opacity=".55">${Array.from({ length:12 }).map((_, i) => { const a = i * 30 * Math.PI / 180, w = 7.5 * Math.PI / 180; return html`<path key=${i} d=${'M81 49 L' + (81 + Math.cos(a - w) * 120) + ' ' + (49 + Math.sin(a - w) * 120) + ' L' + (81 + Math.cos(a + w) * 120) + ' ' + (49 + Math.sin(a + w) * 120) + 'Z'}/>`; })}</g>` : null;
  const body = html`<g>
      <path d=${cloth} fill=${A}/>
      <g clipPath=${'url(#c' + id + ')'}>${pattern}<rect x="0" y="0" width="170" height="110" fill=${'url(#f' + id + ')'}/><rect x="0" y="0" width="170" height="30" fill="#fff" opacity=".07"/></g>
      ${f.trim !== 'none' ? html`<path d=${cloth} transform="translate(81 49) scale(.93 .84) translate(-81 -49)" fill="none" stroke=${TRIMS[f.trim]} strokeWidth="1.6" strokeDasharray="4 3" strokeLinecap="round" opacity=".9"/>` : null}
      <path d=${cloth} fill="none" stroke="#0a0a0a" strokeWidth="3.2" strokeLinejoin="round"/>
      <g transform="translate(81 49)"><g opacity=".98" transform="scale(.86)"><${FlagEmblem} kind=${f.emblem} tone=${f.emblemTone}/></g><g transform=${(f.gear === 'tricorn' || f.gear === 'crown') ? 'translate(0 7) scale(.76)' : 'translate(0 1) scale(.86)'}><${FlagSkull} kind=${f.skull} gear=${f.gear} tone=${f.skullTone}/></g></g>
    </g>`;
  return html`<svg className=${'flag-svg ' + className} viewBox="0 0 160 104" width=${size} height=${Math.round(size * 104 / 160)} role="img" aria-label=${t('flag.title')}>
    <defs><clipPath id=${'c' + id}><path d=${cloth}/></clipPath>
      <linearGradient id=${'f' + id} x1="0" y1="0" x2=".22" y2="0" spreadMethod="reflect"><stop offset="0" stopColor="#000" stopOpacity=".26"/><stop offset=".5" stopColor="#fff" stopOpacity=".09"/><stop offset="1" stopColor="#000" stopOpacity=".26"/></linearGradient>
      ${wave ? html`<filter id=${'w' + id} x="-6%" y="-12%" width="112%" height="124%"><feTurbulence type="fractalNoise" baseFrequency="0.011 0.03" numOctaves="1" seed="3" result="n"><animate attributeName="baseFrequency" dur="7s" values="0.011 0.03;0.017 0.04;0.011 0.03" repeatCount="indefinite"/></feTurbulence><feDisplacementMap in="SourceGraphic" in2="n" scale="7" xChannelSelector="R" yChannelSelector="G"/></filter>` : null}</defs>
    <rect x="3" y="2" width="6" height="100" rx="3" fill="#6b4a22" stroke="#0a0a0a" strokeWidth="1.6"/><circle cx="6" cy="4" r="5" fill="#e9b73e" stroke="#0a0a0a" strokeWidth="1.6"/>
    ${wave ? html`<g filter=${'url(#w' + id + ')'}>${body}</g>` : body}</svg>`;
}

      ${row(t('flag.trim'), 'trim', FLAG_OPTS.trim.map(v => chip('trim', v, 'tr')))}
      ${row(t('flag.skull'), 'skull', FLAG_OPTS.skull.map(v => mini('skull', v, 'k')))}
      ${row(t('flag.gear'), 'gear', FLAG_OPTS.gear.map(v => mini('gear', v, 'g')))}

      ${row(t('flag.emblem'), 'emblem', FLAG_OPTS.emblem.map(v => mini('emblem', v, 'e')))}
      ${row(t('flag.emblemTone'), 'emblemTone', FLAG_OPTS.emblemTone.map(v => chip('emblemTone', v, 'tt')))}
    </div></div>`;
}
/* musica: UN solo archivo que pones tu junto al index.html (MUSIC_FILE). Sin sonidos generados. */
const MUSIC_FILE = 'musica.mp3', MUSIC_VOLUME = .5;
const SND = (() => {
  let a = null, muted = false, failed = false;
  try { muted = localStorage.getItem('lp-mute') === '1'; } catch (e) {}
  const make = () => { if (a || failed) return; try { a = new Audio(MUSIC_FILE); a.loop = true; a.volume = MUSIC_VOLUME; a.preload = 'auto'; a.addEventListener('error', () => { failed = true; a = null; }); } catch (e) { failed = true; a = null; } };
  return {
    unlock(){ make(); if (a && !muted && a.paused) a.play().catch(() => {}); },
    toggle(){ muted = !muted; try { localStorage.setItem('lp-mute', muted ? '1' : '0'); } catch (e) {} make(); if (a) { if (muted) a.pause(); else a.play().catch(() => {}); } return muted; },
    get muted(){ return muted; },
  };
})();

function BossIntro({ stage, onGo }){
  const s = STAGES[stage], b = s.boss;
  const [n, setN] = useState(0);
  useEffect(() => {
    if (!(b.bounty > 0)) return;
    let raf; const t0 = performance.now();
    const tick = now => { const k = Math.min(1, (now - t0) / 2000); setN(Math.round(b.bounty * (1 - Math.pow(1 - k, 3)))); if (k < 1) raf = requestAnimationFrame(tick); };
    raf = requestAnimationFrame(tick); return () => cancelAnimationFrame(raf);
  }, []);
  return html`
    <${Modal} tone=${RANKS[b.rank].color} eyebrow=${t('boss.eyebrow', { stage:L(s.name) })} title=${t('rank.' + b.rank)} icon=${RANKS[b.rank].icon}>
      <div className="wanted-big">
        <div className="wb-title">${b.bounty > 0 ? t('poster.wanted') : t('rank.' + b.rank)}</div>
        <div className="wb-pic"><${Face} look=${b.look} color=${b.color} size=${150} crown=${b.rank === 'yonko'} className="pic" avatar=${b.avatar}/></div>
        <div className="wb-name">${bossName(b)}</div>
        ${b.title ? html`<div className="wb-sub">${L(b.title)}</div>` : null}
        <div className="wb-bounty">${b.bounty > 0 ? fmtBounty(n) : L(s.name)}</div>
        <div className="wb-doa">${b.bounty > 0 ? t('boss.doa') : t('boss.guard')}</div>
      </div>
      <button type="button" className="btn" onClick=${onGo}>${t('boss.face')}</button>
    <//>`;
}

function App(){
  const [lang, setLangState] = useState(() => { try { return localStorage.getItem('lp-lang') === 'es' ? 'es' : 'en'; } catch (e) { return 'en'; } });
  LANG = lang;
  const setLang = k => { setLangState(k); try { localStorage.setItem('lp-lang', k); } catch (e) {} };
  useEffect(() => { document.documentElement.lang = lang; }, [lang]);

  const [phase, setPhase] = useState('loading');   // loading | error | start | play
  const [raw, setRaw] = useState({});
  const [src, setSrc] = useState({});
  const [errors, setErrors] = useState([]);
  const [dataOpen, setDataOpen] = useState(false);
  const [captainId, setCaptainId] = useState(null);
  const [avatarId, setAvatarId] = useState(null);
  const [archId, setArchId] = useState(null);
  const [sheet, setSheet] = useState(null);
  const [manualOpen, setManualOpen] = useState(false);
  const [tutOn, setTutOn] = useState(false);
  const [meta, setMetaState] = useState(readMeta);
  const [toast, setToast] = useState(null);
  const updateMeta = fn => setMetaState(m => { const n = fn(m); if (n !== m) writeMeta(n); return n; });
  const [g, setG] = useState(null);
  const [tab, setTab] = useState('map');
  const [modal, setModal] = useState(null);
  const [dismissId, setDismissId] = useState(null);
  const [zoom, setZoom] = useState(null);
  const [burst, setBurst] = useState(null);
  const [hover, setHover] = useState(null);
  const [saved, setSaved] = useState(null);
  const [hardcore, setHardcore] = useState(false);
  const [flag, setFlagState] = useState(readFlag);
  const setFlag = f => { setFlagState(f); try { localStorage.setItem('lp-flag', JSON.stringify(f)); } catch (e) {} };
  const [muted, setMuted] = useState(SND.muted);
  const [devOn, setDevOn] = useState(() => { try { return localStorage.getItem(DEV_KEY) === '1'; } catch (e) { return false; } });
  const [devAsk, setDevAsk] = useState(false), [devOpen, setDevOpen] = useState(false);
  const devTaps = React.useRef([]);
  const devTry = () => { if (devOn) setDevOpen(true); else setDevAsk(true); };
  const devTap = () => { const n = Date.now(); devTaps.current = [...devTaps.current.filter(x => n - x < 2500), n]; if (devTaps.current.length >= 5) { devTaps.current = []; devTry(); } };
  useEffect(() => { const f = e => { if (e.ctrlKey && e.shiftKey && (e.key === 'D' || e.key === 'd')) { e.preventDefault(); devTry(); } }; window.addEventListener('keydown', f); return () => window.removeEventListener('keydown', f); });
  useEffect(() => { const f = () => SND.unlock(); window.addEventListener('pointerdown', f); window.addEventListener('keydown', f); return () => { window.removeEventListener('pointerdown', f); window.removeEventListener('keydown', f); }; }, []);

  const goStart = () => {
    const sv = readSave(); setSaved(sv ? sv.g : null);
    const first = NAKAMAS.find(n => n.captain);
    setCaptainId(first ? first.id : null); setAvatarId(AVATARS[0] ? AVATARS[0].id : null); setArchId(ARCHETYPES[0] ? ARCHETYPES[0].id : null); setSheet(null); setG(null); setModal(null); setBurst(null); setHover(null); setTab('map'); setDismissId(null); setZoom(null); setPhase('start');
  };
  const boot = async () => {
    setPhase('loading'); setErrors([]);
    const loaded = {}, sources = {}, errs = [];
    for (const [k, name] of FILES){
      try { loaded[k] = await fetchJson(name); sources[k] = 'page'; }
      catch (e){ errs.push(name + ': ' + e.message); }
    }
    setRaw(loaded); setSrc(sources);
    if (errs.length){ setErrors(errs); setPhase('error'); return; }
    const res = buildData(loaded);
    if (res.errors.length){ setErrors(res.errors); setPhase('error'); return; }
    installData(res.data); goStart();
  };
  useEffect(() => { boot(); }, []);

  const loadLocal = async (k, file) => {
    let parsed;
    try { parsed = JSON.parse(await file.text()); }
    catch (e){ setErrors([t('data.invalidJson', { name: file.name })]); return; }
    const nextRaw = { ...raw, [k]: parsed }, nextSrc = { ...src, [k]: 'local:' + file.name };
    setRaw(nextRaw); setSrc(nextSrc);
    if (!FILES.every(([key]) => nextRaw[key])) { setErrors([]); return; }
    const res = buildData(nextRaw);
    if (res.errors.length){ setErrors(res.errors); return; }
    setErrors([]); installData(res.data); goStart();
  };

  const start = () => { BATTLE_PREFS.auto = false; BATTLE_PREFS.fast = false; setG(newGame(effCaptain(meta, captainId).id, { avatarId, archetypeId:effArch(meta, archId).id, hardcore, flag:normFlag(flag) })); setTab('map'); setPhase('play'); };

  const continueSave = () => { const sv = readSave(); if (!sv) { setSaved(null); return; } BATTLE_PREFS.auto = !!sv.auto; BATTLE_PREFS.fast = !!sv.fast; setG(sv.g); setModal(null); setTab('map'); setPhase('play'); };
  const discardSave = () => { clearSave(); setSaved(null); };
  useEffect(() => { if (phase === 'play' && g && !modal && !g.dev) writeSave(g); }, [g, modal, phase]);
  useEffect(() => { if (phase === 'play' && g && !g.dev) updateMeta(m => metaFromRun(m, g)); }, [g, phase]);
  useEffect(() => {
    const fresh = MISSIONS.filter(m => missionDone(m, meta) && !meta.notified.includes(m.id));
    if (!fresh.length) return;
    setToast(fresh); updateMeta(m => ({ ...m, notified:[...m.notified, ...fresh.map(f => f.id)] }));
    const id = setTimeout(() => setToast(null), 7000); return () => clearTimeout(id);
  }, [meta]);

  const pick = node => {
    if (modal || burst || g.over) return;
    setBurst(node.id);
    setTimeout(() => {
      setG(cur => ({ ...cur, pos: node.id, visited: [...cur.visited, node.id] }));
      setBurst(null); setHover(null); setModal(node.id);
    }, 650);
  };
  const finishCombat = rep => {
    setModal(null);
    if (!rep.win) setG(cur => ({ ...cur, over: 'lose' }));
    else if (rep.boss) setG(cur => advance(cur));
  };

  const node = phase === 'play' && g && modal ? g.map.byId[modal] : null;
  const close = () => setModal(null);
  const paneCls = k => (tab === k ? 'block' : 'hidden') + ' lg:block';
  const playing = phase === 'play' && g;
  const canAct = !!playing && !modal && !burst && !g.over;
  const discard = id => setG(cur => removeItem(cur, id));

  return html`
    <${ZoomCtx.Provider} value=${setZoom}>
    <${SheetCtx.Provider} value=${setSheet}>
    <div className="h-full flex flex-col gap-3 px-4 pt-3" style=${{ paddingBottom: 'max(10px, env(safe-area-inset-bottom, 0px))' }}>
      <header className="flex items-center gap-3 justify-between flex-wrap">
        <div className="flex items-baseline gap-3 min-w-0">
          ${playing ? html`<span title=${(g.flag && g.flag.name) || ''}><${Flag} flag=${g.flag || flag} size=${46}/></span>` : null}<h1 className="m-0" onClick=${devTap} style=${{ fontFamily:'var(--font-display)', fontSize:'34px', lineHeight:1, color:'var(--gold)', textShadow:'0 3px 0 #000' }}>OnePieceLike</h1>
          <span className="eyebrow hidden md:inline">${t('app.tagline')}</span><span className="eyebrow" style=${{ opacity:.6, marginLeft:6 }}>v${APP_VERSION}</span>
        </div>
        <div className="flex items-center gap-2 flex-wrap">
          <button type="button" className=${'btn ghost small snd-btn' + (muted ? ' off' : '')} aria-pressed=${!muted} title=${t('snd.title')} onClick=${() => { SND.unlock(); setMuted(SND.toggle()); }}>♪<span className="snd-x"></span></button>
          ${playing ? html`
            <span className="timer" style=${{ color:'var(--gold)' }} title=${t('hdr.berries')}><span style=${{ fontSize:'18px' }}>฿</span> ${g.berries}</span>` : null}
          <${LangToggle} lang=${lang} setLang=${setLang}/>
          <button type="button" className="btn small man-open" onClick=${() => setManualOpen(true)}>${t('man.btn')}</button>
          <button type="button" className="btn ghost small" title=${t('hdr.tutorialTip')} onClick=${() => { try { localStorage.setItem('lp-tut', '[]'); } catch (e) {} setTutOn(true); setTimeout(() => setTutOn(false), 2500); }}>${tutOn ? '✓ ' + t('hdr.tutorialOn') : t('hdr.tutorial')}</button>
          <button type="button" className="btn ghost small" onClick=${() => setDataOpen(true)}>${t('hdr.data')}</button>
          ${phase === 'play' || phase === 'start' ? html`<button type="button" className="btn ghost small" onClick=${goStart}>${t('hdr.newRun')}</button>` : null}
        </div>
      </header>

      ${phase === 'loading' ? html`<main className="flex-1 min-h-0 panel flex items-center justify-center"><span className="eyebrow">${t('load.loading')}</span></main>` : null}

      ${phase === 'error' ? html`
        <main className="flex-1 min-h-0 panel overflow-y-auto">
          <div className="mx-auto max-w-[620px] flex flex-col gap-3 py-6">
            <h2 className="ptitle m-0">${t('load.errorTitle')}</h2>
            <p className="m-0" style=${{ color:'var(--mist)' }}>${t('load.errorHelp')}</p>
            <div className="errbox" role="alert"><ul className="m-0 pl-4">${errors.map((e, i) => html`<li key=${i}>${e}</li>`)}</ul></div>
            <div className="flex gap-2"><button type="button" className="btn" onClick=${boot}>${t('load.retry')}</button><button type="button" className="btn ghost" onClick=${() => setDataOpen(true)}>${t('hdr.data')}</button></div>
          </div>
        </main>` : null}

      ${phase === 'start' ? html`<main className="flex-1 min-h-0 panel overflow-y-auto"><${StartScreen} meta=${meta} onManual=${() => setManualOpen(true)} captainId=${captainId} setCaptainId=${setCaptainId} avatarId=${avatarId} setAvatarId=${setAvatarId} archId=${archId} setArchId=${setArchId} flag=${flag} setFlag=${setFlag} hardcore=${hardcore} setHardcore=${setHardcore} saved=${saved} onContinue=${continueSave} onDiscardSave=${discardSave} onStart=${start}/></main>` : null}

      ${playing ? html`
        <main className="flex-1 min-h-0 grid gap-3 lg:grid-cols-[300px_minmax(0,1fr)_320px]">
          <section className=${'panel min-h-0 min-w-0 overflow-y-auto ' + paneCls('crew')} aria-label=${t('crew.title')}><${CrewPanel} g=${g} onDismiss=${canAct ? setDismissId : null}/></section>
          <section className=${'panel min-h-0 min-w-0 ' + (tab === 'map' ? 'flex flex-col' : 'hidden') + ' lg:flex lg:flex-col'} aria-label=${L(STAGES[g.stage].name)}><${MapPanel} g=${g} burst=${burst} hover=${hover} setHover=${setHover} onPick=${pick}/></section>
          <section className=${'panel min-h-0 min-w-0 overflow-y-auto ' + paneCls('loot')} aria-label=${t('loot.title')}><${LootPanel} g=${g} onDiscard=${discard} locked=${!canAct} onEquip=${(i, c) => setG(cur => equipItem(cur, i, c))} onUnequip=${i => setG(cur => unequipItem(cur, i))}/></section>
        </main>
        <nav className="lg:hidden grid grid-cols-3 gap-2">
          ${[['crew', t('nav.crew')], ['map', t('nav.map')], ['loot', t('nav.loot')]].map(([k, l]) => html`<button key=${k} type="button" className=${'navbtn truncate' + (tab === k ? ' on' : '')} onClick=${() => setTab(k)} aria-pressed=${tab === k}>${l}</button>`)}
        </nav>` : null}

      ${node && !g.over ? (
        node.type === 'marine' || node.type === 'pirate' || node.type === 'boss' ? html`<${CombatEvent} key=${node.id} g=${g} setG=${setG} node=${node} done=${finishCombat}/>`
        : node.type === 'market'  ? html`<${MarketEvent}  key=${node.id} g=${g} setG=${setG} done=${close}/>`
        : node.type === 'recruit' ? html`<${RecruitEvent} key=${node.id} g=${g} setG=${setG} done=${close}/>`
        : node.type === 'camp'    ? html`<${CampEvent}    key=${node.id} g=${g} setG=${setG} done=${close}/>`
        : node.type === 'event'   ? html`<${MapEvent}     key=${node.id} g=${g} setG=${setG} node=${node} done=${() => { updateMeta(m => ({ ...m, events:m.events + 1 })); close(); }}/>`
        : html`<${ChestEvent} key=${node.id} g=${g} setG=${setG} done=${close}/>`
      ) : null}
      ${toast ? html`<div className="mission-toast" role="status" onClick=${() => setToast(null)}><b>🏴‍☠️ ${t('ms.done')}</b>${toast.map(m => html`<div key=${m.id}>${missionText(m)} → <b>${t(m.unlock.arch ? 'ms.rewardArch' : 'ms.rewardHero', { name:rewardName(m) })}</b></div>`)}</div>` : null}
      ${playing && g.over ? html`<${EndScreen} g=${g} onRestart=${goStart}/>` : null}
      ${playing && dismissId && !g.over ? html`<${DismissDialog} key=${dismissId} g=${g} id=${dismissId} setG=${setG} onClose=${() => setDismissId(null)}/>` : null}
      ${dataOpen ? html`<${DataDialog} raw=${raw} src=${src} errors=${errors} onFile=${loadLocal} onReload=${() => { setDataOpen(false); boot(); }} onClose=${() => setDataOpen(false)}/>` : null}
      ${manualOpen ? html`<${ManualScreen} onClose=${() => setManualOpen(false)}/>` : null}
      ${devAsk ? html`<${DevAsk} onClose=${() => setDevAsk(false)} onOk=${() => { try { localStorage.setItem(DEV_KEY, '1'); } catch (e) {} setDevOn(true); setDevAsk(false); setDevOpen(true); }}/>` : null}
      ${devOn && !devOpen ? html`<button type="button" className="dev-fab" onClick=${() => setDevOpen(true)} aria-label="Developer mode">DEV</button>` : null}
      ${devOpen ? html`<${DevPanel} g=${g} phase=${phase} meta=${meta} setG=${setG} updateMeta=${updateMeta} onClose=${() => setDevOpen(false)} onLock=${() => { try { localStorage.removeItem(DEV_KEY); } catch (e) {} setDevOn(false); setDevOpen(false); }} onBuild=${o => { BATTLE_PREFS.auto = false; BATTLE_PREFS.fast = false; setG(devBuild(newGame(effCaptain(meta, captainId).id, { avatarId, archetypeId:effArch(meta, archId).id, hardcore:false, flag:normFlag(flag) }), o)); setModal(null); setTab('map'); setPhase('play'); setDevOpen(false); }}/>` : null}
      ${sheet ? html`<${CharSheet} c=${sheet} onClose=${() => setSheet(null)}/>` : null}
      ${zoom ? html`<${ZoomModal} z=${zoom} onClose=${() => setZoom(null)}/>` : null}
    </div>
    <//>
    <//>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
