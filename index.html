<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}
/* ===== v3: batalla, ficha, armonia ===== */
.modal.wide{max-width:860px}
.role-chip{font:700 12px var(--font-ui);letter-spacing:.08em;text-transform:uppercase;padding:1px 7px;border:2px solid #000;border-radius:3px;background:color-mix(in srgb,var(--rc) 30%,#08202b);color:color-mix(in srgb,var(--rc) 70%,#fff);white-space:nowrap}
.haki-chips{display:inline-flex;gap:3px}
.haki-chip{display:inline-flex;align-items:center;gap:2px;font:700 12px var(--font-ui);padding:0 5px;border:2px solid #000;border-radius:3px;background:color-mix(in srgb,var(--hc) 38%,#06151d);color:#fff;box-shadow:0 0 8px color-mix(in srgb,var(--hc) 60%,transparent)}
.haki-chip.sm{font-size:11px;padding:0 4px}
.haki-chip b{color:var(--gold)}
.stat-bars{display:flex;flex-direction:column;gap:4px}
.sb{display:grid;grid-template-columns:128px 1fr 22px;gap:8px;align-items:center;font:600 13px var(--font-ui);letter-spacing:.05em;text-transform:uppercase}
.sb-n{color:var(--mist)}.sb-v{text-align:right;color:var(--foam);font-variant-numeric:tabular-nums}
.sb-t{height:10px;background:rgba(0,0,0,.45);border:2px solid #000;border-radius:2px;overflow:hidden}.sb-t i{display:block;height:100%}
.sheet-btn{margin-left:auto}
.harm-bar{position:relative;height:12px;border:2px solid #000;border-radius:3px;background:linear-gradient(90deg,#8a2a1f,#3a3a3a 50%,#1c8a63);margin:2px 0 8px}
.harm-bar .mid{position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:#fff8}
.harm-bar b{position:absolute;top:-4px;width:8px;height:16px;border:2px solid #000;border-radius:2px;transform:translateX(-50%)}
.harm-roles{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
.harm-list{list-style:none;margin:0 0 6px;padding:0;font:500 14px var(--font-body)}
.harm-list .pos{color:var(--kelp)}.harm-list .neg{color:var(--ember)}
.sheet{position:relative;width:100%;max-width:920px;max-height:94vh;overflow-y:auto;background:linear-gradient(180deg,var(--hull-2),var(--hull));border:4px solid #000;border-radius:6px;box-shadow:inset 0 0 0 3px var(--tone,var(--gold)),0 10px 0 rgba(0,0,0,.4);padding:18px;animation:rise .3s cubic-bezier(.3,1.5,.5,1)}
.sheet-grid{display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
@media(min-width:760px){.sheet-grid{grid-template-columns:minmax(0,340px) minmax(0,1fr)}}
.sheet-photo{display:block;width:100%;border:3px solid #000;border-radius:4px;box-shadow:0 0 0 2px var(--line);background:color-mix(in srgb,var(--tone,#f6b73c) 22%,#06151d);overflow:hidden;line-height:0;cursor:zoom-in;padding:0}
.sheet-photo img,.sheet-photo svg{width:100%;height:auto;max-height:60vh;object-fit:contain;display:block}
.sheet-name{font-family:var(--font-display);font-size:42px;line-height:1;margin:0;color:var(--foam)}
.sheet-desc{color:var(--paper);font:500 16px/1.45 var(--font-body);margin:6px 0 10px}
.sheet-nums{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
.sp-card{display:flex;flex-direction:column;gap:2px;padding:6px 10px;border:2px solid #000;border-radius:4px;background:rgba(246,183,60,.1);box-shadow:inset 0 0 0 1px rgba(246,183,60,.4)}
.sp-card b{font:700 16px var(--font-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--gold)}.sp-card span{font:500 13px var(--font-body);color:var(--mist)}
.haki-card{display:flex;gap:10px;align-items:center;padding:6px 10px;border:2px solid #000;border-radius:4px;background:rgba(0,0,0,.28);opacity:.55;font:500 13px var(--font-body)}
.haki-card.on{opacity:1;background:color-mix(in srgb,var(--hc) 22%,#071c27);box-shadow:inset 0 0 0 1px var(--hc),0 0 14px color-mix(in srgb,var(--hc) 45%,transparent)}
.haki-card b{font:700 15px var(--font-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--foam)}
.haki-glyph{font:700 26px var(--font-display);width:38px;height:38px;border:2px solid #000;border-radius:50%;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--hc) 60%,#000);color:#fff}
.avatar-pick{flex-direction:row;align-items:center;justify-content:center;text-align:left;gap:16px}
.avatar-pick .face{width:96px;height:96px}
.arch-pick{gap:8px}
.mini-ally{display:flex;gap:8px;align-items:center;padding:4px 8px;border:2px solid #000;border-radius:4px;background:rgba(0,0,0,.28);cursor:pointer;color:var(--foam);text-align:left}
.mini-ally small{display:block;color:var(--mist);font:500 11px var(--font-ui);letter-spacing:.08em;text-transform:uppercase}
.foe-brief{display:flex;gap:10px;padding:8px;border:2px solid #000;border-radius:4px;background:rgba(0,0,0,.25);box-shadow:inset 0 0 0 1px var(--line)}
.foe-face{display:flex;align-items:center;justify-content:center;border:3px solid #000;border-radius:4px;background:color-mix(in srgb,var(--fc) 35%,#08202b);color:var(--fc);flex:none}
.tg{font:700 11px var(--font-ui);letter-spacing:.06em;text-transform:uppercase;padding:0 5px;border:2px solid #000;border-radius:3px;background:#0a2230;white-space:nowrap}
.tg.weak{color:var(--kelp)}.tg.res{color:var(--ember)}.tg.unk{color:var(--mist)}.tg.tr{color:var(--fruit)}.tg em{font-style:normal;opacity:.8}
/* campo de batalla */
.battle{display:flex;flex-direction:column;gap:10px}
.arena{position:relative;display:flex;flex-direction:column;gap:10px;padding:10px;border:3px solid #000;border-radius:6px;background:radial-gradient(ellipse at 50% 0%,#14506a,#082634 70%);box-shadow:inset 0 0 0 2px var(--line);overflow:hidden;min-height:330px}
.side-title{font:700 12px var(--font-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--mist);margin-bottom:4px}
.units{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.foes-side{padding-bottom:8px;border-bottom:2px dashed rgba(255,255,255,.12)}
.bunit{position:relative;width:128px;display:flex;flex-direction:column;gap:3px;padding:6px;border:2px solid #000;border-radius:4px;background:rgba(2,12,18,.55);transition:transform .15s,filter .3s,opacity .3s}
.bunit.f{cursor:pointer}.bunit.f:hover{box-shadow:0 0 0 2px var(--gold)}.bunit.focus{box-shadow:0 0 0 3px var(--gold),0 0 18px rgba(246,183,60,.55)}
.bunit.dead{filter:grayscale(1) brightness(.5);opacity:.6}
.bunit .bface{position:relative;display:flex;justify-content:center}.bunit .face{border:3px solid #000;border-radius:4px}
.bname{font:700 14px var(--font-ui);letter-spacing:.04em;text-align:center}
.gauge{height:6px;border:1px solid #000;background:rgba(0,0,0,.5);border-radius:2px;overflow:hidden}.gauge i{display:block;height:100%;background:linear-gradient(90deg,#3a9bff,#7be0ff);transition:width .3s}.gauge.full i{background:linear-gradient(90deg,#ffd36b,#ff7a59);animation:pulse 0.8s infinite}
@keyframes pulse{50%{filter:brightness(1.6)}}
.sp-btn{font:700 11px var(--font-ui);letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;border:2px solid #000;border-radius:3px;background:#ffd36b;color:#2a1700;cursor:pointer}.sp-btn.on{background:#ff7a59;color:#fff}
.foe-tags{display:flex;flex-wrap:wrap;gap:3px;justify-content:center}
.coach{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border:2px solid var(--gold);border-radius:4px;background:rgba(246,183,60,.12);color:var(--foam);font:500 14px/1.35 var(--font-body)}
.coach .eyebrow{color:var(--gold)}
.hub{display:flex;flex-direction:column;gap:24px;padding-top:2vh}.hub .grid{gap:14px}
.hub-tile{display:flex;align-items:center;gap:14px;padding:12px 14px;border:3px solid #000;border-radius:6px;background:linear-gradient(180deg,rgba(18,52,70,.9),rgba(8,30,42,.9));color:var(--foam);text-align:left;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(246,183,60,.25);transition:transform .15s,box-shadow .15s}
.hub-tile:hover{transform:translateY(-2px);box-shadow:inset 0 0 0 2px var(--gold),0 6px 18px rgba(0,0,0,.4)}
.hub-ico{width:64px;height:64px;display:flex;align-items:center;justify-content:center;font-size:36px;flex:none}
.hub-txt{display:flex;flex-direction:column;min-width:0}.hub-txt b{font:700 22px var(--font-ui);letter-spacing:.05em;text-transform:uppercase;color:var(--gold)}.hub-txt small{font:500 14px var(--font-body);color:var(--mist);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sail-btn{font-size:30px!important;padding:18px 48px!important;min-width:min(100%,420px)}
.mission{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:2px solid #000;border-radius:4px;background:rgba(0,0,0,.28);opacity:.8}.mission.done{opacity:1;box-shadow:inset 0 0 0 1px var(--kelp);background:rgba(61,214,160,.08)}.mission-ico{font-size:18px;line-height:1.2;flex:none}
.pick-card.locked{opacity:.5;cursor:not-allowed;filter:grayscale(.6)}.lock-tag{margin-left:auto;font:600 12px var(--font-ui);color:var(--gold);text-transform:none}
.mission-toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:80;max-width:min(92vw,520px);padding:10px 14px;border:3px solid #000;border-radius:6px;background:#0e2b3a;box-shadow:0 0 0 2px var(--gold),0 8px 30px rgba(0,0,0,.6);color:var(--foam);font:500 14px/1.35 var(--font-body);cursor:pointer;animation:toastin .35s ease-out}.mission-toast b{color:var(--gold)}
@keyframes toastin{from{opacity:0;transform:translate(-50%,16px)}}
.tut-box{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:8px 10px;border:2px solid var(--gold);border-radius:4px;background:rgba(246,183,60,.1);font-size:13px;line-height:1.35}.tut-box .tut-txt{flex:1 1 260px;min-width:0}.tut-box .tut-btns{display:flex;gap:6px}
.tut-stance .stances{animation:tutglow 1.1s ease-in-out infinite}.tut-prot .prot-btn:not(:disabled){animation:tutglow 1.1s ease-in-out infinite}.tut-special .gauge{animation:tutglow 1.1s ease-in-out infinite}
@keyframes tutglow{50%{box-shadow:0 0 0 3px var(--gold),0 0 16px rgba(246,183,60,.8)}}
.tgt-tag{position:absolute;top:-8px;right:-4px;font-size:18px;animation:pulse-t 1s ease-in-out infinite}
@keyframes pulse-t{50%{transform:scale(1.25)}}
.bunit.targeted{box-shadow:0 0 0 3px #ff5d47,0 0 14px rgba(255,93,71,.55)}
.roar-warn{padding:6px 10px;border:2px solid #000;border-radius:4px;background:rgba(255,93,71,.18);color:#ffb3a6;font:700 14px var(--font-ui);letter-spacing:.04em;text-align:center}
.report{display:flex;flex-direction:column;gap:2px;padding:8px 10px;border:2px solid #000;border-radius:4px;background:rgba(0,0,0,.3)}
.rep-row{display:grid;grid-template-columns:minmax(0,1.6fr) repeat(4,minmax(0,1fr));gap:6px;align-items:center;font:500 13px var(--font-body);color:var(--foam);padding:2px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.rep-row>span:not(:first-child){text-align:right}.rep-head{font:700 11px var(--font-ui);letter-spacing:.05em;text-transform:uppercase;color:var(--mist)}.rep-row.ko{opacity:.55}.mvp{color:var(--gold)}
.prot-tag{position:absolute;top:-6px;left:6px;font-size:18px}
.prot-btn{margin-top:2px;padding:2px 6px;font:600 11px var(--font-ui);letter-spacing:.05em;text-transform:uppercase;border:2px solid #000;border-radius:4px;background:rgba(61,214,160,.14);color:var(--foam);cursor:pointer}.prot-btn.on{background:#3dd6a0;color:#04201a}.prot-btn:disabled{opacity:.4;cursor:not-allowed}
.stun-tag{position:absolute;top:-6px;right:6px;font-size:18px;animation:spin 1.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.float{position:absolute;left:50%;top:6px;transform:translateX(-50%);font:700 22px var(--font-display);color:#fff;text-shadow:0 2px 0 #000,0 0 6px #000;animation:floatup 1.1s ease-out forwards;pointer-events:none;white-space:nowrap;z-index:5}
.float.crit{color:#ffd36b;font-size:30px}.float.weak{color:#7dffc4}.float.res{color:#ff9a8a}.float.miss{color:#c9d7dc;font-size:16px}.float.heal{color:#3dd6a0}.float.obs{color:#7bc0ff;font-size:16px}
@keyframes floatup{0%{opacity:0;transform:translate(-50%,10px)}15%{opacity:1}100%{opacity:0;transform:translate(-50%,-40px)}}
.a-hit{animation:hit .35s}@keyframes hit{25%{transform:translateX(-6px);filter:brightness(2) saturate(2)}50%{transform:translateX(6px)}}
.a-act{transform:scale(1.07)}.a-dodge{animation:dodge .4s}@keyframes dodge{40%{transform:translateX(14px);opacity:.5}}
.a-special{box-shadow:0 0 0 3px #ffd36b,0 0 24px #ffd36b;transform:scale(1.1)}
.a-heal{box-shadow:0 0 0 3px #3dd6a0,0 0 18px #3dd6a0}.a-shield{box-shadow:0 0 0 3px #3dd6a0}.a-mark{box-shadow:0 0 0 3px #b66dff,0 0 18px #b66dff}.a-stun{filter:saturate(.3)}
.a-ko{animation:ko .8s forwards}@keyframes ko{to{transform:translateY(8px) rotate(-6deg);opacity:.45}}
.has-arm .face{box-shadow:0 0 0 2px #1a1030,0 0 10px #9b6bff}
.has-arm.a-arm .face,.a-arm .face{box-shadow:0 0 0 3px #000,0 0 18px #9b6bff,inset 0 0 14px #000}
.a-obsflash .face{box-shadow:0 0 0 3px #3aa7ff,0 0 22px #3aa7ff}
.banner{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);z-index:8;font:700 34px var(--font-display);color:var(--bc,#ffd36b);text-shadow:0 3px 0 #000,0 0 14px var(--bc);letter-spacing:.06em;animation:banner 1.2s ease-out forwards;pointer-events:none;white-space:nowrap}
@keyframes banner{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}80%{opacity:1}100%{opacity:0}}
.ov-text{position:absolute;inset:0;z-index:7;display:flex;align-items:center;justify-content:center;pointer-events:none}
.ov-text span{font:700 clamp(28px,6vw,54px) var(--font-display);letter-spacing:.08em;color:#fff;text-shadow:0 4px 0 #000;animation:banner 2s ease-out forwards;text-align:center;padding:0 12px}
.arena.ov-con{animation:shake .5s 3;background:radial-gradient(ellipse at 50% 50%,#7a1030,#2a0614 75%)}
.arena.ov-foecon,.arena.ov-clash{animation:shake .5s 3;background:radial-gradient(ellipse at 50% 50%,#4a0a40,#14041a 75%)}
.arena.ov-arm{background:radial-gradient(ellipse at 50% 50%,#2a1a55,#07031a 75%)}
.arena.ov-obs{background:radial-gradient(ellipse at 50% 50%,#10508a,#031425 75%)}
.arena.ov-con::after,.arena.ov-foecon::after,.arena.ov-clash::after{content:"";position:absolute;inset:0;z-index:6;pointer-events:none;background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(255,60,110,.0) 0 8deg,rgba(255,60,110,.28) 8deg 10deg);animation:spin 3s linear infinite;mix-blend-mode:screen}
.arena.ov-foecon::after,.arena.ov-clash::after{background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(190,60,255,0) 0 8deg,rgba(190,60,255,.3) 8deg 10deg)}
@keyframes shake{25%{transform:translate(-4px,2px)}50%{transform:translate(4px,-2px)}75%{transform:translate(-3px,-2px)}}
.battle-log{min-height:92px;padding:8px 10px;border:2px solid #000;border-radius:4px;background:rgba(0,0,0,.4);font:500 14px var(--font-body);color:var(--mist);display:flex;flex-direction:column;justify-content:flex-end}
.battle-log .last{color:var(--foam);font-weight:600}
.ctl{display:flex;flex-direction:column;gap:8px}
.stances{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stance{display:flex;flex-direction:column;gap:1px;padding:6px 8px;text-align:left;border:2px solid #000;border-radius:4px;background:rgba(0,0,0,.3);color:var(--foam);cursor:pointer}
.stance b{font:700 15px var(--font-ui);letter-spacing:.06em;text-transform:uppercase}.stance small{font:500 11px/1.2 var(--font-body);color:var(--mist)}
.stance.on{box-shadow:inset 0 0 0 2px var(--gold);background:rgba(246,183,60,.12)}.stance:disabled{opacity:.6}
.big-res{font:700 26px var(--font-display);letter-spacing:.05em}
@media(max-width:560px){.bunit{width:104px}.sb{grid-template-columns:84px 1fr 20px}.stances small{display:none}}

.man-wrap{position:fixed;inset:0;z-index:60;background:rgba(2,9,13,.86);display:flex;align-items:center;justify-content:center;padding:12px;animation:fade .2s ease-out}
.man{position:relative;width:100%;max-width:1040px;height:100%;max-height:94vh;display:flex;flex-direction:column;background:linear-gradient(180deg,var(--hull-2),var(--hull));border:4px solid #000;border-radius:6px;box-shadow:inset 0 0 0 3px var(--gold),0 20px 60px rgba(0,0,0,.6)}
.man-head{display:flex;align-items:center;gap:12px;padding:14px 18px 8px}
.man-head h2{font-family:var(--font-display);font-size:32px;margin:0;color:var(--gold);line-height:1}
.man-tabs{display:flex;gap:6px;flex-wrap:wrap;padding:0 18px 10px;border-bottom:2px solid var(--line)}
.man-tab{font:700 15px var(--font-ui);letter-spacing:.08em;text-transform:uppercase;padding:6px 12px;border:3px solid #000;border-radius:4px;background:#103445;color:var(--foam);cursor:pointer;box-shadow:0 3px 0 #000}
.man-tab.on{background:linear-gradient(#ffd36b,#f6b73c);color:#2a1700}
.man-body{flex:1;min-height:0;overflow-y:auto;padding:14px 18px 22px;display:flex;flex-direction:column;gap:14px}
.man-body h3{font:700 15px var(--font-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--foam);margin:6px 0 0;display:flex;align-items:center;gap:8px}
.man-body h3::after{content:"";flex:1;height:2px;background:repeating-linear-gradient(90deg,var(--line) 0 6px,transparent 6px 10px)}
.man-body p{margin:0;line-height:1.5;color:var(--foam)}
.man-body p.dim,.man-body .dim{color:var(--mist)}
.man-grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.man-card{display:flex;gap:10px;align-items:flex-start;padding:10px;border:3px solid #000;border-radius:4px;background:rgba(0,0,0,.28);box-shadow:inset 0 0 0 2px var(--line);text-align:left;color:var(--foam)}
.man-card .nm{font:700 18px var(--font-ui);color:var(--foam)}
.man-card .tiny{font-size:13px;color:var(--mist);line-height:1.35}
.man-card .stat-bars{margin-top:4px}
button.man-card{cursor:pointer;font:inherit}
button.man-card:hover{box-shadow:inset 0 0 0 2px var(--gold)}
.man-chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.man-sub{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.man-menu-card{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 16px;border:3px solid #000;border-radius:4px;background:linear-gradient(90deg,rgba(246,183,60,.18),rgba(0,0,0,.2));box-shadow:inset 0 0 0 2px var(--gold)}
.btn.man-open{background:linear-gradient(#7be0ff,#3aa9d6);color:#06222d}
@media (max-width:640px){.man-wrap{padding:0}.man{max-height:100%;border-radius:0}.man-head h2{font-size:26px}}


/* ===== identidad pirata ===== */
.flag-toggle{width:100%;background:none;border:0;padding:4px 0;cursor:pointer;text-align:left;color:var(--foam)}
.flag-toggle:hover .flag-hint{color:var(--gold)}
.flag-caret{display:inline-block;transition:transform .15s;color:var(--gold)}.flag-caret.open{transform:rotate(90deg)}
.flag-mini{display:inline-flex;align-items:center;gap:8px;text-transform:none;letter-spacing:.02em}
.flag-mini-name{font:400 17px var(--font-display);color:var(--gold)}
.flag-hint{margin-left:auto;font:600 12px var(--font-ui);letter-spacing:.12em;color:var(--mist);order:3}
.flag-toggle::after{order:2}
.flag-picker{display:grid;grid-template-columns:minmax(240px,270px) minmax(0,1fr);gap:18px;align-items:start;padding:14px;border:3px solid #000;border-radius:4px;background:rgba(0,0,0,.28);box-shadow:inset 0 0 0 2px var(--line)}
@media(max-width:700px){.flag-picker{grid-template-columns:minmax(0,1fr)}}
.flag-preview{display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px 8px;border-radius:4px;background:radial-gradient(ellipse at 50% 30%,#2a6a8c 0,#0b2634 75%);box-shadow:inset 0 0 0 2px var(--line);position:sticky;top:0}
.flag-name{font:400 22px/1.1 var(--font-display);color:var(--gold);text-align:center;text-shadow:0 2px 0 #000;min-height:24px}
.flag-rows{display:flex;flex-direction:column;gap:12px;min-width:0}
.flag-row{display:flex;flex-direction:column;gap:5px}

<style>
/* Concepto: puente de mando de un barco. Tres paneles de casco oscuro con bordes gruesos de arcade

:root{

.hp{height:22px;background:#000;border:3px solid #000;outline:2px solid var(--line);border-radius:3px;position:relative;overflow:hidden}

/* corcho */
.cork{background:radial-gradient(circle at 20% 30%,rgba(255,255,255,.08) 0 1.5px,transparent 2.5px),radial-gradient(circle at 70% 60%,rgba(0,0,0,.14) 0 1.5px,transparent 2.5px),#8a5a33;background-size:13px 13px,10px 10px,auto;border:5px solid #4a2c15;box-shadow:inset 0 0 22px rgba(0,0,0,.6),0 0 0 2px #000;padding:14px 10px 10px;border-radius:3px}

.poster .pin{position:absolute;top:-7px;left:50%;margin-left:-6px;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff9a8a,#c52a1a);box-shadow:0 2px 0 rgba(0,0,0,.4)}

.poster h4{font-size:13px}

.poster.ghost{background:transparent;box-shadow:none;border:2px dashed rgba(233,218,180,.5);color:rgba(233,218,180,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:72px}

/* mapa */
.sea-wrap{border:3px solid #000;box-shadow:inset 0 0 0 2px var(--line);border-radius:6px;overflow:hidden;background:var(--abyss)}

.node .body{transition:transform .18s cubic-bezier(.3,1.7,.5,1),filter .18s;transform-origin:0 0}

<body>
<div id="root"><main style="max-width:720px;margin:12vh auto;padding:0 16px;font-family:Barlow,system-ui,sans-serif;color:#e8d9a8;text-align:center"><h1 style="font-family:'Pirata One',serif;font-size:2.4rem;margin:0 0 .4rem">OnePieceLike</h1><p style="margin:0;opacity:.85">One Piece roguelike autobattler: build your crew, sail the Grand Line, defeat the bosses and fly your own Jolly Roger.</p><noscript><p>This game needs JavaScript enabled.</p></noscript></main></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js"></script>

<script>
/* =====================================================================
   LA BODEGA DE DATOS Y REGLAS (sin DOM: se puede probar en un terminal)
   Los personajes, frutas, jefes y etapas NO viven aqui: llegan de
   characters.json, fruits.json, stages.json e items.json (ver buildData).
   ===================================================================== */
let STAGES = [], NAKAMAS = [], BOSSES = [], FRUITS = [], ITEMS = [];
const APP_VERSION = '1.6.0'; /* sube este numero en cada cambio de archivo */
let COMMON_ENEMIES = { marine: [], pirate: [] };
let SETTINGS = {};
const MAP_W = 560, MAP_H = 830;

/* Rangos de jefe: estructura del juego, no contenido (el contenido son los JSON). */
const RANKS = {
  pirate:      { icon:'skull',  color:'#8db0b5', bounty:30e6 },
  shichibukai: { icon:'swords', color:'#b66dff', bounty:400e6 },
  admiral:     { icon:'anchor', color:'#5aa9ff', bounty:0 },
  yonko:       { icon:'crown',  color:'#f6b73c', bounty:4.5e9 },
};
const DEFAULT_SETTINGS = { allyHpK:.8, allyAtkK:.72, crewScaleBase:.5, crewScaleK:.1, bossExtraFrom:3, bossRoarEvery:3, bossRoar:.4, bossEnrage:.5, bossEnrageAtk:1.2, rewardMarine:1, rewardPirate:1.35, rewardBoss:3, rewardExp:.6, marketInflation:.2, rationPrice:45, rationInflation:.2, foeHpK:3.0, foeAtkK:.32, marineMult:1.2, pirateMult:1.4, normalRamp:.15, dropMarine:.22, dropPirate:.32, dismissFeePerCost:20, dismissLeaveChance:.15, floors:6, crewSlots:9, leadership:10, leadershipPerStage:3, startBerries:120, levelUpAtkMult:1.3, levelUpHpMult:1.2 };

/* Tipos de nodo. La etiqueta de cada uno vive en i18n (type.<clave>). */
const TYPES = {
  marine:  { color:'#5aa9ff', icon:'shield',  freq:3 },
  pirate:  { color:'#ff5d47', icon:'skull',   freq:3 },
  market:  { color:'#f6b73c', icon:'coin',    freq:2 },
  recruit: { color:'#7be0ff', icon:'recruit', freq:2 },
  camp:    { color:'#3dd6a0', icon:'tent',    freq:2 },
  chest:   { color:'#b66dff', icon:'fruit',   freq:1 },
  event:   { color:'#ffa94d', icon:'bottle',  freq:1 },
  boss:    { color:'#ff5d47', icon:'crown',   freq:0 },
};

/* ---------- utilidades ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(arr,rnd){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor((rnd?rnd():Math.random())*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function weightedPick(list,k){return list.map(x=>({x,k:-Math.log(Math.random()||1e-9)/(x.weight||1)})).sort((a,b)=>a.k-b.k).slice(0,k).map(o=>o.x)}
const fmtBounty = n => '฿ ' + Math.round(n).toLocaleString('es-ES');

/* ---------- perfil de combate de un nakama (rol, estilo, estadisticas) ---------- */
function combatProfile(n){
  const frole = ROLE_STYLE[n.frole] ? n.frole : roleFromClasses(n.classes);
  const base = ROLE_STATS[frole], st = {};
  for (const k of ['str', 'spd', 'swd', 'aim', 'int', 'def']) st[k] = clamp(Math.round(typeof (n.stats || {})[k] === 'number' ? n.stats[k] : base[k]), 1, 10);
  return { frole, style:ROLE_STYLE[n.style] ? n.style : ROLE_STYLE[frole], stats:st };
}
/* ---------- validacion y construccion de los datos ---------- */
const FX_NUM = ['spd','dodge','crit','acc','charge','regen','guard','lifesteal','dbl','splash','stun','rez','thorns','aggro'];
const FX_TEAM = ['atk','guard','regen','dodge','crit','charge','foeAtk'];
function cleanFx(x){
  const o = {}; if (!x || typeof x !== 'object') return o;
  FX_NUM.forEach(k => { const v = Number(x[k]); if (isFinite(v) && v) o[k] = v; });
  if (x.pierce) o.pierce = true;
  if (x.team && typeof x.team === 'object') { const t = {}; FX_TEAM.forEach(k => { const v = Number(x.team[k]); if (isFinite(v) && v) t[k] = v; }); if (Object.keys(t).length) o.team = t; }
  return o;
}
function buildData(raw){
  const errors = [];
  const need = (cond, msg) => { if (!cond) errors.push(msg); };
  const ch = raw.characters || {}, fr = raw.fruits || {}, st = raw.stages || {}, it = raw.items || {};
  need(Array.isArray(ch.nakamas), 'characters.json: "nakamas" must be an array');
  need(Array.isArray(ch.bosses), 'characters.json: "bosses" must be an array');
  need(Array.isArray(fr.fruits), 'fruits.json: "fruits" must be an array');
  need(Array.isArray(st.stages) && st.stages.length > 0, 'stages.json: "stages" must be a non-empty array');
  need(Array.isArray(it.items), 'items.json: "items" must be an array');
  if (errors.length) return { errors };
  const num = (v, d) => (typeof v === 'number' && isFinite(v)) ? v : d;
  const seen = (arr, id, file) => { if (arr.includes(id)) errors.push(file + ': duplicated id "' + id + '"'); arr.push(id); };

  const ids = [];
  const nakamas = ch.nakamas.map((n, i) => {
    need(n && n.id, 'characters.json: nakamas[' + i + '] needs an "id"');
    const id = String(n && n.id); seen(ids, id, 'characters.json nakamas');
    const captain = !!n.captain;
    return { id, name:n.name || id, role:n.role || (Array.isArray(n.classes) ? n.classes.join(' · ') : ''), captain, recruitable: n.recruitable !== undefined ? !!n.recruitable : !captain,
      cost:Math.max(1, Math.round(num(n.cost, 2))), baseHp:num(n.baseHp, 50), baseAtk:num(n.baseAtk, 8), color:n.color || '#7be0ff',
      look:Math.abs(Math.round(num(n.look, 0))) % 6, avatar:n.avatar || null, minStage:num(n.minStage, 1), weight:num(n.weight, 1),
      ...combatProfile(n), desc:n.desc || null, groups:Array.isArray(n.groups) ? n.groups : [], hakiBase:parseHaki(n.haki_unlocked), powerSource:n.power_source || null, hero:!!n.hero, alias:n.alias || null, perk:n.perk || null };
  });
  need(nakamas.some(n => n.captain), 'characters.json: at least one nakama needs "captain": true');

  const bids = [];
  const bosses = ch.bosses.map((b, i) => {
    need(b && b.id, 'characters.json: bosses[' + i + '] needs an "id"');
    const id = String(b && b.id); seen(bids, id, 'characters.json bosses');
    need(RANKS[b.rank], 'characters.json: boss "' + id + '" has an invalid rank "' + b.rank + '" (use pirate, shichibukai, admiral or yonko)');
    return { id, rank:b.rank, name:b.name || id, title:b.title || '', bounty:num(b.bounty, (RANKS[b.rank] || {}).bounty || 0), powerMult:num(b.powerMult, 1),
      color:b.color || (RANKS[b.rank] || {}).color || '#f6b73c', look:Math.abs(Math.round(num(b.look, 0))) % 6, avatar:b.avatar || null, placeholder:false,

/* ---------- reclutas y frutas disponibles ---------- */
const recruitCandidates = g => {
  const taken = new Set(g.crew.flatMap(c => { const d = NAKAMAS.find(x => x.id === c.charId); return d && d.alias ? [c.charId, d.alias] : [c.charId]; }));
  return NAKAMAS.filter(n => n.recruitable && n.minStage <= g.stage + 1 && !taken.has(n.id) && !(g.dismissed || []).includes(n.id));
};
const availableFruits = g => FRUITS.filter(f => !g.crew.some(c => c.fruit && c.fruit.id === f.id) && !(g.lostFruits || []).includes(f.id));
/* ofertas de reclutamiento: 3 por parada, siempre caras nuevas (no repite las ya ofrecidas en la partida), de roles distintos,
   favoreciendo los roles que a la tripulacion le faltan y garantizando que al menos una se pueda pagar */
function recruitOffers(g, k = 3){
  const pool = recruitCandidates(g), seen = new Set(g.offered || []);
  let fresh = pool.filter(n => !seen.has(n.id)); if (fresh.length < k) fresh = pool;
  const have = r => g.crew.filter(c => c.frole === r).length;
  const chosen = [];
  const draw = (list, wf) => { const o = list.map(x => ({ x, k:-Math.log(Math.random() || 1e-9) / Math.max(.01, wf(x)) })).sort((a, b) => a.k - b.k)[0]; return o ? o.x : null; };
  const COST_W = { 1:1, 2:1, 3:1, 4:.8, 5:.5, 6:.3 }; /* los nakamas caros (5-6 de liderazgo) salen bastante menos que los de 3-4 */
  const base = n => (n.weight || 1) * (COST_W[n.cost] || .3) * (have(n.frole) === 0 ? 2 : have(n.frole) >= (ROLE_CAP[n.frole] || 3) ? .4 : 1);
  const first = draw(fresh.filter(n => canRecruit(n, g)), base) || draw(fresh, base);
  if (first) chosen.push(first);
  while (chosen.length < k) {
    const rest = fresh.filter(n => !chosen.includes(n));
    const nx = draw(rest, n => base(n) * (chosen.some(c => c.frole === n.frole) ? .3 : 1));
    if (!nx) break; chosen.push(nx);

/* ---------- generador del mapa (el Log Pose) ---------- */
function genMap(seed, si, ctx){
  const F = SETTINGS.floors;
  const rnd = mulberry32(seed + si * 7919);
  const laneX = l => 80 + l * 100, floorY = f => 650 - f * (588 / (F - 1));
  const floors = [];
  for (let f = 0; f < F; f++){
    if (f === F - 1){ floors.push([{ lane:2 }]); continue; }
    const count = f === 0 ? 3 : (rnd() < .55 ? 3 : 4);
    const lanes = shuffle([0,1,2,3,4], rnd).slice(0, count).sort((a, b) => a - b);
    floors.push(lanes.map(l => ({ lane:l })));
  }
  floors.forEach((row, f) => row.forEach((n, i) => {
    n.f = f; n.id = f + '-' + i;
    n.x = f === F - 1 ? 280 : laneX(n.lane) + (rnd() * 24 - 12);
    n.y = f === F - 1 ? 62 : floorY(f) + (rnd() * 22 - 11);
    n.nextN = [];
  }));
  // rutas bifurcadas: todo nodo sale hacia arriba y a todo nodo le llega alguna ruta
  for (let f = 0; f < F - 1; f++){
    const A = floors[f], B = floors[f + 1];
    A.forEach(a => {
      let cand = f === F - 2 ? B : B.filter(b => Math.abs(b.lane - a.lane) <= 1);
      if (!cand.length){ const m = Math.min(...B.map(b => Math.abs(b.lane - a.lane))); cand = B.filter(b => Math.abs(b.lane - a.lane) === m); }
      cand = shuffle(cand, rnd);
      a.nextN.push(cand[0]);
      if (cand[1] && rnd() < .5) a.nextN.push(cand[1]);
    });
    B.forEach(b => {
      if (!A.some(a => a.nextN.includes(b))){
        const near = A.slice().sort((p, q) => Math.abs(p.lane - b.lane) - Math.abs(q.lane - b.lane))[0];
        near.nextN.push(b);
      }
    });
  }
  // balance: alta (combate), media (isla: mercado o reclutamiento / campamento), baja (cofre de fruta)
  const pickType = f => {
    let w;
    if (f === 0) w = { combat:78, island:22 };
    else if (f === F - 2) w = { combat:25, island:30, camp:45 };
    else w = { combat:55, island:18, camp: f === 1 ? 9 : 16, chest: (ctx.fruit && f >= 2) ? 7 : 0 };
    let tot = 0; for (const k in w) tot += w[k];
    let r = rnd() * tot;
    for (const k in w){ if ((r -= w[k]) < 0) return k; }
    return 'combat';
  };
  const flat = [];
  floors.forEach((row, f) => row.forEach(n => {
    if (f === F - 1) n.type = 'boss';
    else {
      const t = pickType(f);
      n.type = t === 'combat' ? (rnd() < .5 ? 'marine' : 'pirate')
             : t === 'island' ? ((ctx.recruit && rnd() < .6) ? 'recruit' : 'market') : t;
    }
    flat.push(n);
  }));
  const cnt = t => flat.filter(n => n.type === t).length;
  const conv = (arr, type) => { if (arr.length) shuffle(arr, rnd)[0].type = type; };
  const mid = flat.filter(n => n.f >= 1 && n.f <= F - 3);
  if (ctx.fruit && cnt('chest') === 0){ const deep = mid.filter(n => n.f >= 2); conv(deep.length ? deep : mid, 'chest'); }
  if (cnt('camp') === 0) conv(mid.filter(n => n.type !== 'chest'), 'camp');
  // el Capitan empieza solo: siempre hay al menos un reclutamiento al alcance de las primeras paradas
  if (ctx.recruit && cnt('recruit') === 0) conv(flat.filter(n => n.f <= Math.min(2, F - 3) && ['marine', 'pirate', 'market'].includes(n.type)), 'recruit');
  // con hasta 9 huecos, cada mar ofrece al menos dos reclutamientos
  if (ctx.recruit) while (cnt('recruit') < 2 && flat.some(n => n.f >= 1 && n.f <= F - 3 && ['marine', 'pirate', 'market'].includes(n.type))) conv(flat.filter(n => n.f >= 1 && n.f <= F - 3 && ['marine', 'pirate', 'market'].includes(n.type)), 'recruit');
  flat.filter(n => n.type === 'chest').slice(2).forEach(n => n.type = 'marine');
  // eventos con decision y riesgo: sustituyen algun combate de en medio (siempre hay al menos uno por mar, como mucho tres)
  { const cand = () => flat.filter(n => n.f >= 1 && n.f <= F - 3 && (n.type === 'marine' || n.type === 'pirate'));
    cand().forEach(n => { if (cnt('event') < 3 && rnd() < .12) n.type = 'event'; });
    if (cnt('event') === 0) conv(cand(), 'event'); }
  const E = STAGES[si].enemies || {};
  const pickName = list => list.length ? list[Math.floor(rnd() * list.length)] : null;
  flat.forEach(n => {
    n.enemyName = n.type === 'marine' ? pickName(E.marine || COMMON_ENEMIES.marine)
                : n.type === 'pirate' ? pickName(E.pirate || COMMON_ENEMIES.pirate) : null;
    n.next = n.nextN.map(b => b.id);
    delete n.nextN;
  });
  const byId = {}; flat.forEach(n => byId[n.id] = n);
  return { nodes:flat, byId, floors };
}

/* La run empieza con UN solo personaje: el Capitan elegido, con su arquetipo y su retrato. */

const mods = g => g.items.reduce((m, it) => { for (const k in it.fx) m[k] = (m[k] || 0) + it.fx[k]; return m; },

function devGiveFruits(g, n){
  for (let i = 0; i < n; i++) { const f = availableFruits(g).sort(rnd0)[0], c = g.crew.find(x => !x.fruit && x.hp > 0); if (!f || !c) break; g = eat(g, c.id, f); }
  return g;
}
function devGiveItems(g, n, gear){
  for (let i = 0; i < n; i++) { const it = itemPool({ ...g, stage:STAGES.length }).filter(x => !!x.equip === !!gear && !slotFull(g, x)).sort(rnd0)[0]; if (!it) break; g = gainItem(g, it); }
  return g;
}
function devHealAll(g){ return { ...g, crew:g.crew.map(c => ({ ...c, hp:c.maxHp })) }; }
/* ---- build "optima" para el modo dev: elige lo mejor en vez de al azar ---- */
function devItemScore(g, it){
  const f = it.fx || {}, n = Math.max(1, g.crew.length), ph = g.crew.reduce((s, c) => s + c.maxHp, 0) || 1;
  let v = (f.power || 0) + (f.guard || 0) * 1.3 + ((f.hp || 0) * n) / ph * .9 + (f.lead || 0) * .1 + (f.crit || 0) * 1.2 + (f.acc || 0) * .8 + (f.dodge || 0)
    + (f.charge || 0) * .012 + (f.regen || 0) * 4 + (f.harm || 0) * .01 + (f.calm || 0) * .15 + (f.ambush || 0) + (f.ward || 0) * .05 + (f.revive || 0) * .12 + (f.reveal || 0) * .04;
  const e = it.equip;
  if (e) v += ((e.atkPct || 0) + Object.values(e.stats || {}).reduce((a, b) => a + b, 0) * .03 + (e.crit || 0) * 1.2 + (e.acc || 0) * .8 + (e.dodge || 0) + (e.guardPct || 0) + (e.hpPct || 0) * .5 + Object.values(e.haki || {}).reduce((a, b) => a + b, 0) * .12 + (e.pierce ? .08 : 0)) * Math.min(1, 1.6 / n);
  return v;
}
function devFruitScore(f){
  let v = (f.atk || 1) * (f.hp || 1); const x = f.fx || {};
  for (const k in x) { if (k === 'team') { for (const j in x.team) v += (x.team[j] || 0) * 1.2; } else if (typeof x[k] === 'number') v += x[k] * .35; }
  return v;
}
const devCrewQ = crew => crew.reduce((s, c) => s + c.atk, 0) * crew.reduce((s, c) => s + c.maxHp, 0) * (1 + harmony(crew).score / 100);
function devBestCrew(g, want, stage, good){
  let cand = recruitCandidates(g).slice();
  while (g.crew.length < want && cand.length) {
    /* modo "good": respeta el liderazgo de una run normal, evita los 6 y solo mira una muestra de candidatos (como en una tienda real) */
    let pool = good ? cand.filter(d => (d.cost <= 4 || (d.cost === 5 && g.crew.filter(c => c.cost >= 5).length < 2)) && canRecruit(d, g)) : cand;
    if (!pool.length) break;
    if (good) pool = pool.slice().sort(() => Math.random() - .5).slice(0, 9);
    let bi = -1, bq = -1;
    pool.forEach((d, i) => { const q = devCrewQ([...g.crew, makeMember(d, stage, 'tmp')]); if (q > bq) { bq = q; bi = i; } });
    const def = pool[bi]; cand = cand.filter(x => x !== def);
    g = { ...g, crew:[...g.crew, makeMember(def, stage, 'c' + g.uid)], uid:g.uid + 1 };
  }
  return g;
}
function devBestItems(g, n, gear, good){
  for (let i = 0; i < n; i++) {
    let list = itemPool(good ? g : { ...g, stage:STAGES.length }).filter(x => !!x.equip === !!gear && !slotFull(g, x) && !g.items.some(y => y.id === x.id)).sort((a, b) => devItemScore(g, b) - devItemScore(g, a));
    if (good) list = list.slice(1, 8);
    const it = good ? list[Math.floor(Math.random() * Math.min(4, list.length))] : list[0];
    if (!it) break; g = gainItem(g, it);
  }
  return g;
}
function devBestFruits(g, n, good){
  const fs = availableFruits(g).slice().sort((a, b) => devFruitScore(b) - devFruitScore(a));
  for (let i = 0; i < n && fs.length; i++) {
    const c = g.crew.filter(x => !x.fruit && x.hp > 0).sort((a, b) => b.atk * b.maxHp - a.atk * a.maxHp)[0];
    if (!c) break;
    const k = good ? Math.min(fs.length - 1, 2 + Math.floor(Math.random() * 6)) : 0; /* good: de las 3-8 mejores, no siempre la mejor */
    g = eat(g, c.id, fs.splice(k, 1)[0]);

}
function devBuild(g0, o){
  const stage = clamp(Math.round(o.stage || 1), 1, STAGES.length);
  let g = { ...g0, dev:true, stage:stage - 1 };
  g.crew = g.crew.map(c => { let x = c; for (let i = 1; i < stage; i++) x = levelUp(x); return { ...x, hp:x.maxHp }; });
  const want = clamp(Math.round(o.crew || 1), 1, SETTINGS.crewSlots);
  const mode = o.mode || (o.best ? 'best' : 'random'), good = mode === 'good';
  if (good) g.lead = g.lead + SETTINGS.leadershipPerStage * (stage - 1);
  const cand = mode === 'random' ? recruitCandidates(g).slice().sort(rnd0) : [];
  if (mode !== 'random') g = devBestCrew(g, want, stage, good);
  while (g.crew.length < want && cand.length) { const def = cand.pop(); g = { ...g, crew:[...g.crew, makeMember(def, stage, 'c' + g.uid)], uid:g.uid + 1 }; }
  if (!good) g.lead = Math.max(g.lead + SETTINGS.leadershipPerStage * (stage - 1), usedLead(g) + 2);
  g.berries = Math.max(0, Math.round(o.berries || 0));
  if (mode !== 'random') {
    const cap = (n, k) => good ? Math.min(n || 0, k) : (n || 0); /* good: cantidades de una run normal a ese mar */
    g = devBestItems(g, cap(o.relics, Math.round(1 + stage * .5)), false, good); g = devBestItems(g, cap(o.gear, Math.round(1 + stage * .5)), true, good); g = devBestFruits(g, cap(o.fruits, Math.ceil(stage * .7)), good);
  }

  g = devHealAll(g); g.map = genMap(g.seed, g.stage, ctxOf(g));

}
/* salta a otro mar conservando la tripulacion (sube de nivel lo que falte) */
function devJump(g, stage){
  stage = clamp(Math.round(stage), 1, STAGES.length);
  const crew = g.crew.map(c => { let x = c; while (x.lvl < stage) x = levelUp(x); return { ...x, hp:x.maxHp }; });
  const g2 = { ...g, dev:true, over:null, stage:stage - 1, pos:null, visited:[], crew, lead:Math.max(g.lead, usedLead({ crew }) + 2) };
  g2.map = genMap(g.seed, g2.stage, ctxOf(g2));
  return g2;
}
function advance(g){
  if (g.stage >= STAGES.length - 1) return { ...g, over:'win' };
  
  // Modificamos el map para que, tras subir de nivel, la vida actual (hp) se iguale a la máxima (maxHp)
  const fullyHealedCrew = g.crew.map(levelUp).map(c => ({ ...c, hp: c.maxHp }));

  const g2 = { ...g, stage:g.stage + 1, pos:null, visited:[], lead:g.lead + SETTINGS.leadershipPerStage, crew: fullyHealedCrew };
  g2.map = genMap(g.seed, g2.stage, ctxOf(g2));
  return g2;
}

const STYLE_STAT = { sword:'swd', gun:'aim', brawl:'str', mind:'int' };
const ROLE_STYLE = { sword:'sword', gun:'gun', brawl:'brawl', tank:'brawl', support:'mind', mind:'mind' };
const ROLE_STATS = {
  sword:{ str:5, spd:7, swd:8, aim:2, int:4, def:4 }, gun:{ str:3, spd:6, swd:1, aim:8, int:5, def:3 },
  brawl:{ str:8, spd:5, swd:2, aim:1, int:4, def:6 }, tank:{ str:7, spd:3, swd:1, aim:1, int:4, def:9 },

const STACK_PEN = 9, MAX_ROUNDS = 24;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

function roleFromClasses(cl){
  const s = (cl || []).join(' ').toLowerCase();
  if (/espad|sword/.test(s)) return 'sword';
  if (/tirad|shoot|sniper|gun/.test(s)) return 'gun';
  if (/soporte|support|m[eé]dic|doctor|heal/.test(s)) return 'support';
  if (/tanque|tank|defens/.test(s)) return 'tank';
  if (/estrateg|mente|mind|intelig|navegante|arque/.test(s)) return 'mind';

}
function parseHaki(list){
  const h = { arm:0, obs:0, con:0 };
  (Array.isArray(list) ? list : []).forEach(x => {
    const s = String(x).toLowerCase().trim();
    if (s === 'arm' || s === 'obs' || s === 'con') { h[s] = Math.max(h[s], 2); return; }
    const k = /armament|armamento|busoshoku/.test(s) ? 'arm' : /observaci|observation|kenbunshoku/.test(s) ? 'obs' : /conquist|conqueror|haoshoku/.test(s) ? 'con' : null;
    if (!k) return;
    h[k] = Math.max(h[k], k === 'arm' && /emisi|emission/.test(s) ? 2 : 1);

}
/* nivel de haki de un miembro: base + 1 cada 4 niveles; el Capitan lo despierta con la experiencia */
function hakiLv(c, k){

  if (c.captain && c.lvl >= (k === 'arm' ? 3 : k === 'obs' ? 5 : 8)) b = Math.max(b, 1);
  if (b <= 0) return 0;

}
const hakiSet = c => ({ arm:hakiLv(c, 'arm'), obs:hakiLv(c, 'obs'), con:hakiLv(c, 'con') });

/* Armonia del equipo: diversidad + sinergia + grupos - roles repetidos. Devuelve puntos (%) */
function harmony(crew){
  const cnt = {}; crew.forEach(c => { cnt[c.frole] = (cnt[c.frole] || 0) + 1; });
  const n = crew.length, D = Object.keys(cnt).length;
  const DIV = [0, 0, 4, 9, 14, 19, 24];
  const div = n >= 2 ? DIV[Math.min(D, 6)] : 0;
  const front = ['sword', 'brawl', 'tank'].some(r => cnt[r]), back = ['gun', 'mind', 'support'].some(r => cnt[r]);
  const syn = n >= 3 && front && back ? 5 : 0;
  const stack = []; let pen = 0;
  for (const r in cnt) { const ex = cnt[r] - (ROLE_CAP[r] || 2); if (ex > 0) { stack.push({ role:r, n:cnt[r], pen:ex * STACK_PEN }); pen += ex * STACK_PEN; } }
  const gc = {}; crew.forEach(c => (c.groups || []).forEach(gid => { gc[gid] = (gc[gid] || 0) + 1; }));
  const groups = []; let gb = 0;
  for (const gid in gc) if (gc[gid] >= 2) { const b = 3 * (gc[gid] - 1); groups.push({ id:gid, n:gc[gid], bonus:b }); gb += b; }
  gb = Math.min(12, gb);
  let pos = div + syn + gb;
  if (crew.some(c => c.perk === 'tactician')) pos = Math.round(pos * 1.5);
  const score = clamp(pos - pen, -35, 35);
  return { score, div, syn, groups, groupBonus:gb, stack, pen, roles:cnt, D, n };
}

const BOSS_WEAK = { logia:'mind', slippery:'brawl', swordmaster:'brawl', giant:'gun', swift:'mind', burn:'gun', dark:'sword', bind:'sword', pulse:null };

/* Poder enemigo = (12 + 3.2 x piso) x powerMult del mar x (marine|pirate)Mult x dificultad x (0.5 + 0.1 x tamano de la banda).

function enemyPower(g, node){

  const n = Math.max(1, g.crew.length), crewK = SETTINGS.crewScaleBase + SETTINGS.crewScaleK * n, diff = SETTINGS.difficulty != null ? SETTINGS.difficulty : 1;
  if (boss) return Math.round((12 + 3.2 * 5) * s.powerMult * SETTINGS.pirateMult * (s.bossMult != null ? s.bossMult : 1.25) * diff * crewK);
  const k = SETTINGS.marineMult * /* piratas = misma dificultad que marina */ (1 + SETTINGS.normalRamp * g.stage) * ((SETTINGS.normalStageMult && SETTINGS.normalStageMult[g.stage]) || 1);

/* esbirros de jefe: escolta inicial o invocados. power = parte del poder del combate que representa */
function mkMinion(power, kind, id, rnd){
  const ks = FOE_KINDS[kind] || FOE_KINDS.pirate, k = ks[Math.floor(rnd() * ks.length)];
  const maxHp = Math.max(4, Math.round(power * SETTINGS.foeHpK * k.hp));
  return { id, boss:false, minion:true, kind:k.id, name:k.name, style:k.style, weak:k.weak, resist:k.resist, traits:[], spd:k.spd, haki:{ arm:0, obs:0, con:0 },
    hp:maxHp, maxHp, atk:Math.round(power * SETTINGS.foeAtkK * k.atk * 10) / 10, stun:0, vuln:0, stunImm:0 };
}
function genFoes(g, node){
  const s = STAGES[g.stage], ep = enemyPower(g, node), boss = node.type === 'boss';
  const rnd = mulberry32(hashStr(g.seed + ':' + g.stage + ':' + node.id));
  if (boss) {
    const b = s.boss, tr = b.traits || [];
    const hk = b.haki || [], lv = b.rank === 'yonko' ? 3 : 2;

      tier:g.stage, hp:0, maxHp:Math.round(bep * SETTINGS.foeHpK * (tr.includes('giant') ? 1.3 : 1)), atk:Math.round(bep * SETTINGS.foeAtkK * 10) / 10, stun:0, vuln:0, stunImm:0 };
    boss0.hp = boss0.maxHp;
    const out = [boss0];
    if (b.escort) for (let i = 0; i < b.escort.n; i++) out.push(mkMinion(ep * b.escort.share / b.escort.n, b.escort.kind, 'f' + (i + 1), rnd));

    const maxHp = Math.max(4, Math.round(ep * SETTINGS.foeHpK * k.hp / sh));
    return { id:'f' + i, boss:false, kind:k.id, name:k.name, style:k.style, weak:k.weak, resist:k.resist, traits:[], spd:k.spd, haki:{ arm:0, obs:0, con:0 },
      hp:maxHp, maxHp, atk:Math.round(ep * SETTINGS.foeAtkK * k.atk / sa * 10) / 10, stun:0, vuln:0, stunImm:0 };

/* ---------- el combate por rondas ---------- */
function mkAlly(c, m = {}){

  const stats = { ...c.stats };
  for (const k in gs) stats[k] = clamp((stats[k] || 0) + gs[k], 0, 12);
  const fx = (c.fruit && c.fruit.fx) || {};
  stats.spd = clamp((stats.spd || 0) + (m.spd || 0) + (fx.spd || 0), 0, 20);
  const hb = hakiSet(c), haki = { arm:Math.min(3, hb.arm + (gh.arm || 0)), obs:Math.min(3, hb.obs + (gh.obs || 0)), con:Math.min(3, hb.con + (gh.con || 0)) };

    lvl:c.lvl, hp:c.hp, maxHp:c.maxHp, atk:Math.round(c.atk * (1 + (eq.atkPct || 0))), haki, logia:!!(c.fruit && c.fruit.type === 'logia'), gauge:0, stun:0,
    acc:(eq.acc || 0) + (m.acc || 0) + (fx.acc || 0), crit:(eq.crit || 0) + (m.crit || 0) + (fx.crit || 0), dodgeB:(eq.dodge || 0) + (m.dodge || 0) + (fx.dodge || 0), charge:(eq.charge || 0) + (m.charge || 0) + (fx.charge || 0),
    guardPct:1 - (1 - (eq.guardPct || 0)) * (1 - (fx.guard || 0)), aggro:(eq.aggro || 1) * (fx.aggro || 1), pierce:!!(eq.pierce || fx.pierce),
    lifesteal:fx.lifesteal || 0, dbl:fx.dbl || 0, splash:fx.splash || 0, stunP:fx.stun || 0, rez:fx.rez || 0, thorns:fx.thorns || 0, regenSelf:fx.regen || 0, gearIcon:c.gear ? c.gear.icon : null };
}
function battleInit(g, node){
  const crew = g.crew.filter(c => c.hp > 0), H = harmony(g.crew), m = mods(g);
  const Hs = clamp(H.score + (m.harm || 0), -35, 35);
  const st = { round:0, stageIdx:g.stage, ep:enemyPower(g, node), node:{ id:node.id, type:node.type, f:node.f }, allies:crew.map(c => mkAlly(c, m)), foes:genFoes(g, node), H:Hs,
    atkMult:1 + Hs / 100, takenMult:1 - Hs / 200, power:1 + m.power, guard:clamp(m.guard, 0, .6), shield:Math.round(m.ward || 0), stance:'bal', over:null, rounds:0,
    regen:m.regen || 0, calm:clamp(m.calm || 0, 0, .7), revive:Math.round(m.revive || 0), reviveUsed:0 };
  const T = { atk:0, guard:0, regen:0, dodge:0, crit:0, charge:0, foeAtk:0 };
  crew.forEach(c => { const tm = c.fruit && c.fruit.fx && c.fruit.fx.team; if (tm) for (const k in T) T[k] += tm[k] || 0; });
  st.power += T.atk; st.guard = clamp(st.guard + T.guard, 0, .6); st.regen += T.regen; st.foeAtk = clamp(T.foeAtk, 0, .3);
  st.allies.forEach(a => { a.dodgeB += T.dodge; a.crit += T.crit; a.charge += T.charge; });

  if (g.devPow) st.power *= g.devPow;
  if (m.ambush > 0) st.foes.forEach(f => { f.hp = Math.max(1, Math.round(f.maxHp * (1 - m.ambush * (f.boss ? .5 : 1)))); });
  st.tactician = crew.some(c => c.perk === 'tactician'); st.tally = {};

  st.revealed = st.tactician || m.reveal > 0 || st.allies.some(a => a.haki.obs > 0);

/* ataque: equilibrado / rapido (menos daño, actua antes, carga mas el especial y esquiva mas) / poderoso (mas daño, actua despues, carga menos) */
const STANCES = { bal:{ dmg:1, taken:1, gauge:1, init:0, dodge:0 }, fast:{ dmg:.8, taken:1, gauge:1.35, init:4, dodge:.08 }, pow:{ dmg:1.35, taken:1, gauge:.8, init:-4, dodge:0 } };
function stanceMods(st){

  return { dmg:1 + (b.dmg - 1) * k, taken:1 + (b.taken - 1) * k, gauge:b.gauge, init:b.init * k, dodge:b.dodge * k };

const aliveA = st => st.allies.filter(a => a.hp > 0), aliveF = st => st.foes.filter(f => f.hp > 0);
function styleMult(f, a){

  for (let i = 0; i < N; i++) { const s = autoBattle(g, node, base); if (s.over === 'win') { w++; loss += 1 - s.allies.reduce((x, a) => x + Math.max(0, a.hp), 0) / tot; } }
  const p = w / N, lossAvg = w ? loss / w : 1;
  return [p >= .93 ? 'low' : p >= .75 ? 'medium' : p >= .45 ? 'high' : 'deadly', p >= .93 ? '#3dd6a0' : p >= .75 ? '#f6b73c' : p >= .45 ? '#ff9a3d' : '#ff5d47', Math.round(p * 100), Math.round(lossAvg * 100)];
}

/* ---------- eventos de mapa: cada opcion devuelve { g, rows, key, ...vars }; nunca matan (la vida baja como mucho a 1) ---------- */
const EVENT_IDS = ['castaway', 'trapchest', 'pact', 'whirlpool', 'gamble'];
const eventOf = (g, node) => EVENT_IDS[hashStr(g.seed + ':' + node.id) % EVENT_IDS.length];
const eventBerries = (g, node) => { const s = STAGES[g.stage]; return Math.round((60 + node.f * 8) * Math.pow(s.rewardMult != null ? s.rewardMult : s.powerMult, SETTINGS.rewardExp)); };
function hurtCrew(g, pct){
  const rows = g.crew.map(c => ({ c, from:c.hp, to: c.hp > 0 ? Math.max(1, c.hp - Math.round(c.maxHp * pct)) : 0 }));
  return { rows, g:{ ...g, crew: g.crew.map((c, i) => ({ ...c, hp:rows[i].to })) } };
}
function eventRun(g, node, id, choice, rnd = Math.random){
  const berries = eventBerries(g, node);
  if (id === 'castaway' && choice === 'help') {
    if (rnd() < .3) { const lost = Math.min(g.berries, Math.max(20, Math.round(g.berries * .12))); return { g:{ ...g, berries:g.berries - lost }, key:'thief', n:lost, bad:true }; }
    const def = recruitOffers(g, 1).find(d => canRecruit(d, g));
    if (def) return { g:{ ...g, crew:[...g.crew, makeMember(def, g.stage + 1, 'c' + g.uid)], uid:g.uid + 1 }, key:'joined', def };
    return { g:{ ...g, berries:g.berries + berries }, key:'thanks', n:berries };
  }
  if (id === 'trapchest' && (choice === 'open' || choice === 'haki')) {
    const safe = choice === 'haki' || rnd() < .55;
    if (!safe) { const r = hurtCrew(g, .25); return { ...r, key:'trap', bad:true }; }
    const pool = itemPool(g).filter(i => !slotFull(g, i));
    if (pool.length) { const item = pool[Math.floor(rnd() * pool.length)]; return { g:gainItem(g, item), key:'item', item }; }
    return { g:{ ...g, berries:g.berries + berries * 2 }, key:'gold', n:berries * 2 };
  }
  if (id === 'pact' && choice.startsWith('c:')) {
    const c = g.crew.find(x => x.id === choice.slice(2)); if (!c) return { g, key:'none' };
    const up = levelUp({ ...c, hp:Math.max(1, Math.round(c.hp * .6)) }), to = Math.max(1, Math.round(c.hp * .6) + Math.round((up.maxHp - c.maxHp) * .0));
    const row = { c:{ ...c, maxHp:up.maxHp }, from:c.hp, to };
    return { g:{ ...g, crew:g.crew.map(x => x.id === c.id ? { ...up, hp:to } : x) }, rows:[row], key:'pact', name:c.name };
  }
  if (id === 'whirlpool' && choice === 'cross') {
    if (rnd() < .5) return { g:{ ...g, berries:g.berries + berries * 3 }, key:'wreck', n:berries * 3 };
    const r = hurtCrew(g, .18); return { ...r, key:'smash', bad:true };
  }
  if (id === 'gamble' && (choice === 'small' || choice === 'big')) {
    const bet = Math.min(g.berries, Math.round(g.berries * (choice === 'small' ? .15 : .4)));
    const win = rnd() < (choice === 'small' ? .5 : .4), net = win ? Math.round(bet * (choice === 'small' ? 1.2 : 2)) : -bet;
    return { g:{ ...g, berries:g.berries + net }, key: win ? 'won' : 'lost', n:Math.abs(net), bad:!win };
  }
  return { g, key:'leave' };
}
function sleep(g){
  const pct = .6 + mods(g).camp, full = mods(g).campFull > 0;
  const rows = g.crew.map(c => {
    const to = full ? c.maxHp : c.hp <= 0 ? Math.max(1, Math.round(c.maxHp * .3)) : Math.min(c.maxHp, c.hp + Math.round(c.maxHp * pct));
    return { c, from:c.hp, to };
  });
  return { rows, g:{ ...g, crew: g.crew.map((c, i) => ({ ...c, hp:rows[i].to })) } };
}

    "man.g.goal":"Navega por {s} mares. Al final de cada mar espera un Jefe de Ruta. Derrota a los {s} para reclamar el Gran Tesoro. Si toda tu tripulación cae en un solo combate, la partida termina y empiezas otra con un mapa nuevo.",
    "man.g.mapT":"El mapa",
    "man.g.map":"Cada mar es un mapa de {f} pisos. Empiezas en el puerto y navegas hacia arriba, eligiendo uno de los nodos conectados a tu posición. No se puede volver atrás. Pasa el cursor por un combate para ver su riesgo estimado y el poder enemigo.",
    "man.g.nodesT":"Tipos de nodo",
    "man.n.marine":"Combate contra un escuadrón de marines (2–3 enemigos). Berries moderados. Puede soltar un objeto pasivo.",
    "man.n.pirate":"Combate contra un barco pirata rival. Más duro que los marines, pero paga más y suelta objetos más a menudo.",
    "man.n.market":"Compra objetos con berries (3 ofertas) o raciones que curan el 35% de la vida de todos. Los precios suben un {p}% por cada mar recorrido.",
    "man.n.recruit":"Hay dos candidatos. Recluta a los que te permita el liderazgo. Se unen a tu nivel actual.",

    "man.n.event":"Un suceso en el mar: una decisión con riesgo y recompensa. Un náufrago, un cofre trampa, un pacto extraño, un remolino o un tahúr. Aquí no muere ningún nakama, pero puede doler.",

    "man.g.crewT":"Tu tripulación y el liderazgo",
    "man.g.crew":"Empiezas solo como Capitán y puedes tener hasta {slots} miembros. Cada miembro cuesta liderazgo; el total no puede superar tu liderazgo ({lead} al inicio, +{n} por cada jefe derrotado y por algunos objetos). Antes de zarpar eliges tu aspecto y el estilo de combate del Capitán.",
    "man.g.levelT":"Niveles y K.O.",
    "man.g.level":"Tras un jefe todos suben de nivel (ataque ×{a}, vida ×{h}) y se curan por completo. Los reclutas entran al nivel del mar actual. Un tripulante a 0 de vida está K.O.: no lucha hasta que descanses en un camp o venzas a un jefe. Si pierdes un combate con todos K.O., la partida termina.",
    "man.g.itemsT":"Objetos y berries",
    "man.g.items":"Las reliquias pasivas (hasta {max}) dan bonos a toda la banda. El equipo (hasta {gear}) lo lleva UN tripulante: toca su cara en la lista de Equipo para asignarlo. Descarta o cambia cuando esté lleno.",
    "man.g.dismissT":"Echar a un nakama",
    "man.g.dismiss":"Puedes despedir tripulantes (nunca al Capitán), pero tiene un precio: una indemnización en berries, un {p}% de que otro nakama se marche indignado, la Fruta del Diablo que se hubiera comido se pierde durante la partida y ninguno de los dos vuelve a poder reclutarse.",
    "man.g.archT":"Estilos de Capitán",
    "man.g.tipsT":"Consejos",
    "man.g.tips1":"Mezcla roles: un equipo equilibrado gana bonus de Armonía; repetir el mismo rol se penaliza.",
    "man.g.tips2":"Mira el enfrentamiento antes de luchar: la probabilidad de victoria y la debilidad de cada enemigo (el Haki de Observación las revela).",

    "man.g.tips3":"Los jefes golpean varias veces por ronda y rugen contra toda la banda cada tres rondas. Protege a un herido antes del rugido y céntrate en el punto débil. Los enemigos crecen con el tamaño de tu banda: recluta por equilibrio, no por cantidad.",
    "man.g.tips4":"Descansa en los camps cuando estés herido y cura con raciones antes de un jefe.",
    "man.c.flowT":"Cómo funciona un combate",
    "man.c.flow":"Un combate es una batalla real por rondas. Antes de empezar ves a los enemigos y la probabilidad estimada de victoria. En cada ronda actúa una vez cada luchador vivo, por orden de Velocidad (con algo de suerte). Los aliados atacan a un enemigo; los enemigos atacan a aliados al azar, con preferencia por los tanques y luchadores. Termina cuando caen todos los enemigos (victoria) o todos los aliados quedan K.O. (derrota). Tras {r} rondas la tripulación se ve desbordada, y cuenta como derrota.",
    "man.c.orders":"Tus órdenes: elige una postura cada ronda, toca a un enemigo para que todos le ataquen y toca un especial cargado para lanzarlo. Pulsa Proteger en un nakama para que no ataque y esquive todo el daño esa ronda (y en la ronda siguiente no se podrá proteger a nadie). O pulsa Auto para que la tripulación decida, Rápido para acelerar y Resolver ya para saltar al final.",
    "man.c.dmgT":"Daño, aciertos y críticos",
    "man.c.dmg1":"La fuerza de un ataque sale del ATQ del luchador, potenciado por la estadística de su estilo (Esgrima para espadas, Puntería para armas de fuego, Fuerza para golpes, Inteligencia para lo arcano).",
    "man.c.dmg2":"Las espadas y las armas pueden fallar (más contra enemigos rápidos); los golpes son más fiables; lo arcano casi nunca falla. Un crítico hace ×1,6.",
    "man.c.dmg3":"El daño recibido se reduce con la Defensa del objetivo y puede esquivarse según su Velocidad.",
    "man.c.statsT":"Estadísticas",
    "man.c.styleT":"Estilos de combate y debilidades",
    "man.c.style":"Cada luchador tiene un estilo: cortante, a distancia, contundente o arcano. Golpear la debilidad de un enemigo hace ×1,4 de daño; golpear una resistencia hace ×0,65. Las debilidades están ocultas («?») hasta que golpeas al enemigo o tienes Haki de Observación / un Estratega. Los luchadores listos (Inteligencia 6+) eligen solos al objetivo débil.",
    "man.c.stanceT":"Posturas",
    "man.c.specialT":"Movimientos especiales",
    "man.c.special":"Cada luchador llena un medidor al actuar y al recibir golpes. Cuando está lleno puede lanzar el especial de su rol (automático en modo Auto) y el medidor vuelve a cero.",
    "man.c.harmT":"Armonía",
    "man.c.harm1":"La Armonía es un bonus (o penalización) de −35% a +35% al daño que haces; la mitad también reduce (o aumenta) el daño que recibes.",
    "man.c.harm2":"Variedad de roles: 2 roles +4%, 3 +9%, 4 +14%, 5 +19%, 6 +24%. Primera línea + retaguardia (con 3 o más miembros): +5%. Vínculo: +3% por cada miembro extra del mismo grupo (máx. +12%). Repetir un rol por encima de su límite cuesta −{p}% por cada miembro de más.",
    "man.c.harm3":"Límite de cada rol antes de penalizar: Espadachín {sword}, Tirador {gun}, Luchador {brawl}, Baluarte {tank}, Soporte {support}, Estratega {mind}. Un Capitán Estratega aumenta un 50% la armonía positiva.",
    "man.c.hakiT":"Haki",
    "man.c.haki":"El Haki tiene niveles 1–3. Los nakamas con Haki ganan un nivel cada 4 niveles de personaje; el Capitán despierta el de Armamento en el nivel 3, el de Observación en el 5 y el del Rey en el 8. Sus efectos se ven en la batalla: Armamento muestra un brillo negro, Observación un ojo y el del Rey una onda de choque.",
    "man.c.traitsT":"Rasgos de los jefes",
    "man.c.traitsD":"Los Jefes de Ruta tienen habilidades especiales. Consulta sus rasgos en la pestaña Jefes antes de enfrentarte a ellos.",
    "man.c.lootT":"Recompensas",
    "man.c.loot":"Los marines sueltan un objeto el {m}% de las veces y los piratas el {p}%. Desde el 5.º jefe, cada Jefe de Ruta suelta siempre un trofeo único, mejor que el anterior. Los piratas pagan ×{pm} berries respecto a los marines y los jefes ×{bm}.",
    "man.crew.hint":"Toca un nombre para abrir la ficha completa. Las estadísticas van de 1 a 10 en el nivel 1; ATQ y vida crecen con el nivel.",

let LANG = 'en';
function t(key, vars){
  let s = (i18n[LANG] && i18n[LANG][key]) || i18n.en[key] || key;
  if (vars) for (const k in vars) s = s.split('{' + k + '}').join(String(vars[k]));
  return s;
}
/* L(): texto de un JSON, ya sea una cadena o {en, es}. */
function L(v){
  if (v == null) return '';
  if (typeof v === 'string') return v;
  return v[LANG] || v.en || Object.values(v).find(x => typeof x === 'string') || '';
}
const numLocale = () => LANG === 'es' ? 'es-ES' : 'en-US';
const fmtMult = n => n.toLocaleString(numLocale(), { minimumFractionDigits:1, maximumFractionDigits:2 });
const bossName = b => b.placeholder ? t('boss.unknown', { rank:t('rank.' + b.rank) }) : L(b.name);
const pc = n => Math.round(n * 100);
function fxLines(f){
  const x = f.fx || {}, o = [];
  if (x.spd) o.push(t('fx.spd', { n:x.spd }));
  if (x.dodge) o.push(t('fx.dodge', { n:pc(x.dodge) }));
  if (x.acc) o.push(t('fx.acc', { n:pc(x.acc) }));
  if (x.crit) o.push(t('fx.crit', { n:pc(x.crit) }));
  if (x.charge) o.push(t('fx.charge', { n:x.charge }));
  if (x.guard) o.push(t('fx.guard', { n:pc(x.guard) }));
  if (x.regen) o.push(t('fx.regen', { n:pc(x.regen) }));
  if (x.lifesteal) o.push(t('fx.lifesteal', { n:pc(x.lifesteal) }));
  if (x.dbl) o.push(t('fx.dbl', { n:pc(x.dbl) }));
  if (x.splash) o.push(t('fx.splash', { n:pc(x.splash) }));
  if (x.stun) o.push(t('fx.stun', { n:pc(x.stun) }));
  if (x.pierce) o.push(t('fx.pierce'));
  if (x.thorns) o.push(t('fx.thorns', { n:pc(x.thorns) }));
  if (x.aggro) o.push(t(x.aggro > 1 ? 'fx.aggroUp' : 'fx.aggroDown'));
  if (x.rez) o.push(t('fx.rez', { n:pc(x.rez) }));
  const tm = x.team || {};
  if (tm.atk) o.push(t('fx.t.atk', { n:pc(tm.atk) }));
  if (tm.guard) o.push(t('fx.t.guard', { n:pc(tm.guard) }));
  if (tm.regen) o.push(t('fx.t.regen', { n:+(tm.regen * 100).toFixed(1) }));
  if (tm.dodge) o.push(t('fx.t.dodge', { n:pc(tm.dodge) }));
  if (tm.crit) o.push(t('fx.t.crit', { n:pc(tm.crit) }));
  if (tm.charge) o.push(t('fx.t.charge', { n:tm.charge }));
  if (tm.foeAtk) o.push(t('fx.t.foeAtk', { n:pc(tm.foeAtk) }));
  return o;
}
const fruitMult = f => t('fruit.auto', { atk:fmtMult(f.atk), hp:fmtMult(f.hp) });
const fruitDesc = f => [fruitMult(f), ...fxLines(f)].join(' · ');
const fruitLore = f => L(f.desc);
const fruitType = f => { const k = 'ftype.' + f.type; return i18n.en[k] ? t(k) : String(f.type || ''); };
const nodeLabel = (n, s) => n.type === 'boss' ? t('rank.' + s.bossRank) + ' · ' + bossName(s.boss)
  : n.type === 'marine' ? (L(n.enemyName) || t('type.marine'))
  : n.type === 'pirate' ? (n.enemyName ? t('enemy.ship', { name:L(n.enemyName) }) : t('type.pirate'))
  : t('type.' + n.type);

function SeaMap({ g, burst, hover, setHover, onPick }){
  const s = STAGES[g.stage], map = g.map;
  const avail = availableIds(g);
  const curFloor = g.pos ? map.byId[g.pos].f : -1;
  const statusOf = n => {
    if (n.id === g.pos) return 'current';
    if (g.visited.includes(n.id)) return 'done';
    if (avail.includes(n.id)) return 'available' + (n.type === 'boss' ? ' boss' : '');
    if (n.f <= curFloor) return 'missed';
    return 'locked';
  };
  const edges = [];
  const dock = { x:280, y:775 };
  map.floors[0].forEach(b => edges.push({ k:'d-' + b.id, a:dock, b, cls: g.pos === null ? 'avail' : g.visited[0] === b.id ? 'done' : '' }));
  map.nodes.forEach(a => a.next.forEach(bid => {
    const b = map.byId[bid];
    const cls = g.visited.includes(a.id) && g.visited.includes(bid) && g.visited.indexOf(bid) === g.visited.indexOf(a.id) + 1 ? 'done'
              : a.id === g.pos ? 'avail' : '';
    edges.push({ k:a.id + '>' + bid, a, b, cls });
  }));
  const waves = [];

/* ---------- aplica un evento al estado de VISTA y devuelve cuanto esperar ---------- */
function evName(v, id){
  const u = v.allies.find(x => x.id === id) || v.foes.find(x => x.id === id);
  if (!u) return '?';
  if (u.boss) return bossName(STAGES.map(s => s.boss).find(b => b.id === u.bossId));
  return L(u.name);
}
function showEvent(e, v, fx){
  const unit = id => v.allies.find(x => x.id === id) || v.foes.find(x => x.id === id);
  const flt = (id, text, cls) => fx.floats.push({ k:Math.random(), id, text, cls:cls || '' });
  const A = (id, a) => { fx.anim[id] = a; };
  let d = 1;
  switch (e.t) {
    case 'round': fx.log.push(t('log.round', { n:e.n })); v.round = e.n; d = .4; break;
    case 'atk': {
      const s = unit(e.src), dst = unit(e.dst); if (!dst) break;
      dst.hp = Math.max(0, dst.hp - e.dmg); A(e.src, 'act'); A(e.dst, 'hit');
      flt(e.dst, '-' + e.dmg, e.crit ? 'crit' : e.weak ? 'weak' : e.resist ? 'res' : '');
      if (e.weak) fx.known[e.dst] = true; if (e.resist) fx.known[e.dst] = true;
      if (e.side === 'a' && e.arm) A(e.src, 'arm');
      fx.log.push(t(e.crit ? 'log.atkCrit' : 'log.atk', { a:evName(v, e.src), b:evName(v, e.dst), n:e.dmg }) + (e.weak ? ' · ' + t('bt.weakHit') : e.resist ? ' · ' + t('bt.resistHit') : ''));
      d = e.special ? 1.3 : 1; break; }
    case 'miss': A(e.dst, 'dodge'); A(e.src, 'act'); flt(e.dst, e.foresee ? t('bt.foresee') : t('bt.miss'), e.foresee ? 'obs' : 'miss'); fx.log.push(t(e.foresee ? 'log.foresee' : 'log.miss', { a:evName(v, e.src), b:evName(v, e.dst) })); d = .8; break;
    case 'ko': { const u = unit(e.id); if (u) { u.hp = 0; A(e.id, 'ko'); fx.log.push(t('log.ko', { a:evName(v, e.id) })); } d = 1.1; break; }
    case 'special': A(e.src, 'special'); fx.banner = { text:t('sp.' + e.role), color:ROLE_COLOR[e.role] }; fx.log.push(t('log.special', { a:evName(v, e.src), s:t('sp.' + e.role) })); d = 1.4; break;
    case 'heal': { const u = unit(e.id); if (u) { u.hp = Math.min(u.maxHp, u.hp + e.n); A(e.id, 'heal'); flt(e.id, t('bt.heal', { n:e.n }), 'heal'); fx.log.push(t('log.heal', { a:evName(v, e.id), n:e.n })); } d = .7; break; }
    case 'stun': { const u = unit(e.id); if (u) { u.stun = 1; A(e.id, 'stun'); if (e.dmg) { u.hp = Math.max(1, u.hp - e.dmg); flt(e.id, '-' + e.dmg, 'weak'); } } d = .7; break; }
    case 'skip': { const u = unit(e.id); if (u) { u.stun = Math.max(0, u.stun - 1); flt(e.id, t('bt.stun'), 'miss'); fx.log.push(t('log.skip', { a:evName(v, e.id) })); } d = .6; break; }
    case 'shield': fx.banner = { text:t('bt.shield'), color:ROLE_COLOR.tank }; v.allies.forEach(a => A(a.id, 'shield')); d = 1; break;
    case 'mark': { A(e.id, 'mark'); fx.known[e.id] = true; flt(e.id, t('bt.mark'), 'weak'); d = .4; break; }
    case 'burn': { const u = unit(e.id); if (u) { u.hp = Math.max(0, u.hp - e.dmg); flt(e.id, t('bt.burn') + ' -' + e.dmg, 'res'); A(e.id, 'hit'); } d = .6; break; }
    case 'revive': { const u = unit(e.id); if (u) { u.hp = e.n; u.stun = 0; A(e.id, 'heal'); flt(e.id, t('bt.revive'), 'heal'); fx.banner = { text:t('bt.revive'), color:'#3dd6a0' }; fx.log.push(t('log.revive', { a:evName(v, e.id) })); } d = 1.2; break; }
    case 'drain': { const u = unit(e.id); if (u) { u.hp = Math.min(u.maxHp, u.hp + e.n); flt(e.id, t('bt.drain'), 'heal'); } d = .4; break; }
    case 'pulse': A(e.id, 'special'); fx.overlay = { kind:'foecon', text:t('bt.pulse') }; fx.log.push(t('bt.pulse')); d = 1.6; break;
    case 'summon': { v.foes.push(e.foe); A(e.id, 'special'); fx.banner = { text:t('bt.summon'), color:'#ff9a47' }; fx.log.push(t('bt.summon')); d = 1.2; break; }
    case 'roar': A(e.id, 'special'); fx.banner = { text:t('bt.roar'), color:'#ff5d47' }; fx.log.push(t('bt.roar')); d = 1.1; break;
    case 'enrage': A(e.id, 'special'); fx.banner = { text:t('bt.enrage'), color:'#ff5d47' }; fx.log.push(t('bt.enrage')); d = 1.2; break;
    case 'bind': A(e.id, 'stun'); { const u = unit(e.id); if (u) u.stun = 1; } fx.banner = { text:t('bt.bind'), color:'#ff7a59' }; d = .9; break;
    case 'protect': { const u = unit(e.id); if (u) u.prot = true; A(e.id, 'shield'); flt(e.id, t('bt.protecting'), 'obs'); fx.log.push(t('log.protect', { a:evName(v, e.id) })); d = .8; break; }
    case 'block': A(e.dst, 'shield'); A(e.src, 'act'); flt(e.dst, t('bt.blocked'), 'heal'); fx.log.push(t('log.block', { a:evName(v, e.src), b:evName(v, e.dst) })); d = .9; break;
    case 'evade': flt(e.id, t('bt.evade'), 'obs'); d = .6; break;
    case 'haki': {
      if (e.kind === 'con') { fx.overlay = { kind:'con', text:t('bt.hakiCon') }; fx.log.push(t('bt.hakiCon')); d = 2.6; }
      else if (e.kind === 'arm') { fx.overlay = { kind:'arm', text:t('bt.hakiArm') }; (e.ids || []).forEach(id => A(id, 'arm')); fx.log.push(t('bt.hakiArm')); d = 1.5; }
      else if (e.kind === 'obs') { fx.overlay = { kind:'obs', text:t('bt.hakiObs') }; (e.ids || []).forEach(id => A(id, 'obsflash')); v.revealed = true; fx.log.push(t('bt.hakiObs')); d = 1.5; }
      else if (e.kind === 'foecon') { fx.overlay = { kind:'foecon', text:t('bt.hakiFoe') }; fx.log.push(t('bt.hakiFoe')); d = 2.2; }
      else if (e.kind === 'clash') { fx.overlay = { kind:'clash', text:t('bt.clash') }; if (e.dmg) { const u = unit(e.id); if (u) { u.hp = Math.max(1, u.hp - e.dmg); flt(e.id, '-' + e.dmg, 'weak'); } } fx.log.push(t('bt.clash')); d = 2; }
      break; }
    default: d = .2;
  }
  return d;
}

/* Preferencia de auto/rapido: se mantiene en los combates normales de toda la partida; los jefes siempre empiezan en manual y no la cambian */
const BATTLE_PREFS = { auto:false, fast:false };
function BattleArena({ init, onEnd, boss }){
  const [st, setSt] = useState(init);
  const [view, setView] = useState(init);
  const [busy, setBusy] = useState(false);
  const [stance, setStance] = useState('bal');
  const [focus, setFocus] = useState(null);
  const [fire, setFire] = useState([]);
  const [protect, setProtect] = useState(null);
  const [tutSteps, setTutSteps] = useState(() => {
    if (boss) return [];
    let done = []; try { done = JSON.parse(localStorage.getItem('lp-tut') || '[]'); } catch (e) {}
    const want = ['stance']; if (init.allies.filter(a => a.hp > 0).length > 1) want.push('protect'); want.push('special');
    return want.filter(k => !done.includes(k));
  });
  const tutDone = ks => { setTutSteps(l => l.filter(k => !ks.includes(k))); try { const d = JSON.parse(localStorage.getItem('lp-tut') || '[]'); localStorage.setItem('lp-tut', JSON.stringify([...new Set([...d, ...ks])])); } catch (e) {} };
  const [auto, setAutoS] = useState(() => !boss && BATTLE_PREFS.auto);
  const [fast, setFastS] = useState(() => !boss && BATTLE_PREFS.fast);
  const setAuto = fn => setAutoS(a => { const v = typeof fn === 'function' ? fn(a) : fn; if (!boss) BATTLE_PREFS.auto = v; return v; });
  const setFast = fn => setFastS(a => { const v = typeof fn === 'function' ? fn(a) : fn; if (!boss) BATTLE_PREFS.fast = v; return v; });
  const tut = (!auto && !st.over && tutSteps.find(k => k !== 'special' || st.allies.some(a => a.hp > 0 && a.gauge >= 100))) || null;
  const [anim, setAnim] = useState({});
  const [floats, setFloats] = useState([]);
  const [overlay, setOverlay] = useState(null);
  const [banner, setBanner] = useState(null);
  const [log, setLog] = useState([]);
  const [known, setKnown] = useState({});
  const timers = useRef([]);
  useEffect(() => () => timers.current.forEach(clearTimeout), []);
  const later = (fn, ms) => { timers.current.push(setTimeout(fn, ms)); };

  const play = (forceAuto) => {
    if (busy || st.over) return;
    const next = cloneSt(st);
    const ev = stepRound(next, forceAuto ? { ...autoOrders(next), focus } : { stance, focus, fire: fire.filter(x => x !== protect), protect, auto });
    setBusy(true); setFire([]); setProtect(null);
    const v = cloneSt(st), kn = { ...known };
    let i = 0; const base = fast ? 260 : 520;
    const tick = () => {
      if (i >= ev.length) { setSt(next); setView(next); setAnim({}); setBanner(null); setOverlay(null); setBusy(false); return; }
      const fx = { anim:{}, floats:[], log:[], known:kn, overlay:null, banner:null };
      const d = showEvent(ev[i++], v, fx);
      setView(cloneSt(v)); setAnim(fx.anim); setKnown({ ...kn });
      if (fx.floats.length) { setFloats(f => [...f, ...fx.floats]); later(() => setFloats(f => f.filter(x => !fx.floats.includes(x))), 1100); }
      if (fx.log.length) setLog(l => [...l, ...fx.log].slice(-60));
      if (fx.overlay) { setOverlay(fx.overlay); later(() => setOverlay(null), base * d); }
      if (fx.banner) { setBanner(fx.banner); later(() => setBanner(null), base * d); }
      later(tick, base * d);
    };
    tick();
  };
  useEffect(() => { if (auto && !busy && !st.over) { const id = setTimeout(() => play(false), fast ? 150 : 450); return () => clearTimeout(id); } }, [auto, busy, st, fast]);
  const resolveNow = () => { if (busy) return; const fin = cloneSt(st); let n = 0; while (!fin.over && n++ < MAX_ROUNDS + 2) stepRound(fin, { ...autoOrders(fin), focus }); setSt(fin); setView(fin); onEnd(fin); };
  const toggleProtect = id => { if (tut === 'protect') tutDone(['protect']); setProtect(p => p === id ? null : id); };
  const toggleFire = id => { if (tut === 'special') tutDone(['special']); setFire(f => f.includes(id) ? f.filter(x => x !== id) : [...f, id]); };
  const pickFocus = id => setFocus(f => f === id ? null : id);
  const over = st.over && !busy;

  return html`
    <div className="battle">
      <div className=${'arena' + (overlay ? ' ov ov-' + overlay.kind : '') + (tut ? ' tut-' + tut : '')}>
        ${overlay ? html`<div className=${'ov-text ov-' + overlay.kind}><span>${overlay.text}</span></div>` : null}
        ${banner ? html`<div className="banner" style=${{ '--bc':banner.color }}>${banner.text}</div>` : null}
        <div className="side foes-side"><div className="side-title">${t('bt.foes')} · ${t('bt.round', { n:Math.max(1, view.round || 0) })}</div>
          <div className="units">${view.foes.map(f => html`<${BUnit} key=${f.id} u=${f} side="f" st=${view} anim=${anim} floats=${floats} known=${known} focus=${focus} onPick=${pickFocus}/>`)}</div></div>
        <div className="side crew-side"><div className="side-title">${t('bt.crew')} · ${t('harm.title')} ${st.H > 0 ? '+' : ''}${st.H}%</div>
          <div className="units">${view.allies.map(a => {
            const real = st.allies.find(x => x.id === a.id) || a;
            return html`<${BUnit} key=${a.id} u=${{ ...a, gauge:real.gauge }} side="a" st=${view} anim=${anim} floats=${floats} known=${known} fireable=${real.gauge >= 100 && a.hp > 0 && !busy && !st.over && !auto} firing=${fire.includes(a.id)} onFire=${toggleFire} canProtect=${!busy && !st.over && !auto && st.allies.filter(x => x.hp > 0).length > 1} protectOn=${protect === a.id} protectCd=${st.protLast === st.round} onProtect=${toggleProtect}/>`; })}</div></div>
      </div>
      ${!st.over && !busy && st.foes.some(f => f.boss && f.hp > 0) && (st.round + 1) % SETTINGS.bossRoarEvery === 0 ? html`<div className="roar-warn">⚠ ${t('bt.roarNext')}</div>` : null}
      <div className="battle-log" aria-live="polite">${log.slice(-5).map((l, i, arr) => html`<div key=${log.length - arr.length + i} className=${i === arr.length - 1 ? 'last' : ''}>${l}</div>`)}${log.length === 0 ? html`<div>${t('bt.focusHelp')}</div>` : null}</div>
      ${tut ? html`<div className="tut-box" role="note"><div className="tut-txt"><span className="eyebrow">${t('tut.step', { n:['stance', 'protect', 'special'].indexOf(tut) + 1, m:3 })}</span><p className="m-0">${t('tut.' + tut)}</p></div><div className="tut-btns"><button type="button" className="btn small" onClick=${() => tutDone([tut])}>${t('tut.ok')}</button><button type="button" className="btn ghost small" onClick=${() => tutDone(['stance', 'protect', 'special'])}>${t('tut.skip')}</button></div></div>` : null}
      ${!st.over ? html`
        <div className="ctl">
          <div className="stances" role="radiogroup">${['bal', 'fast', 'pow'].map(k => html`<button key=${k} type="button" role="radio" aria-checked=${stance === k} disabled=${busy} className=${'stance' + (stance === k ? ' on' : '')} title=${t('stance.' + k + 'D')} onClick=${() => { setStance(k); if (tut === 'stance') tutDone(['stance']); }}><b>${t('stance.' + k)}</b><small>${t('stance.' + k + 'D')}</small></button>`)}</div>
          <div className="flex flex-wrap gap-2 items-center">
            <button type="button" className="btn" disabled=${busy || auto} onClick=${() => play(false)}>${t('bt.next')}</button>
            <button type="button" className=${'btn ghost small'} aria-pressed=${auto} onClick=${() => setAuto(a => !a)}>${auto ? t('bt.autoOn') : t('bt.auto')}</button>
            <button type="button" className="btn ghost small" aria-pressed=${fast} onClick=${() => setFast(f => !f)}>${t('bt.fast')} ${fast ? '»»' : '»'}</button>
            <button type="button" className="btn ghost small" disabled=${busy} onClick=${resolveNow}>${t('bt.skip')}</button>
            <span className="text-xs" style=${{ color:'var(--mist)' }}>${focus ? t('bt.focus') + ': ' + evName(view, focus) : t('bt.noFocus')}</span>
          </div>
        </div>` : null}
      ${over ? html`<${BattleReport} st=${st}/>` : null}
      ${over ? html`<div className="flex items-center justify-between gap-3 flex-wrap"><strong className="big-res" style=${{ color: st.over === 'win' ? 'var(--gold)' : 'var(--ember)' }}>${st.over === 'win' ? t('bt.winTitle') : t('combat.sunk')} · ${t('bt.rounds', { n:st.rounds })}</strong><button type="button" className="btn" onClick=${() => onEnd(st)}>${t('combat.outcome')}</button></div>` : null}
    </div>`;
}

function BattleReport({ st }){
  const rows = st.allies.map(a => ({ a, r:(st.tally || {})[a.id] || { dmg:0, taken:0, blocks:0, heal:0 } }));
  const top = rows.reduce((m, x) => x.r.dmg > m ? x.r.dmg : m, 0);
  return html`
    <div className="report" aria-label=${t('bt.sumTitle')}>
      <div className="eyebrow">${t('bt.sumTitle')}</div>
      <div className="rep-row rep-head"><span></span><span>⚔ ${t('bt.sumDmg')}</span><span>🩸 ${t('bt.sumTaken')}</span><span>🛡 ${t('bt.sumBlock')}</span><span>✚ ${t('bt.sumHeal')}</span></div>
      ${rows.map(({ a, r }) => html`
        <div key=${a.id} className=${'rep-row' + (a.hp <= 0 ? ' ko' : '')}>
          <span className="truncate">${top > 0 && r.dmg === top ? html`<b className="mvp" title=${t('bt.mvp')}>★</b> ` : null}${L(a.name)}</span>
          <span className="tabular-nums">${r.dmg}</span><span className="tabular-nums">${r.taken}</span><span className="tabular-nums">${r.blocks}</span><span className="tabular-nums">${r.heal}</span>
        </div>`)}
    </div>`;
}
function FoeBrief({ f, st, crew }){
